<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Distributor & Rider Dispatch Hub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 min-h-screen font-sans text-slate-100 p-4 md:p-6">

  <div class="max-w-2xl mx-auto space-y-4">
    
    <!-- Top Header -->
    <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-3xl backdrop-blur-xl flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl">🛵</span>
          <h1 class="text-lg md:text-xl font-black text-white tracking-tight">Distributor & Rider <span class="text-emerald-400">Dispatch</span></h1>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Live Delivery Fulfillment & Cold-Chain Handover</p>
      </div>
      <button onclick="fetchDeliveries()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl shadow transition-all">
        🔄 Refresh
      </button>
    </div>

    <!-- Active Tasks Filter Tabs -->
    <div class="grid grid-cols-3 gap-2 p-1 bg-slate-900 border border-slate-800 rounded-2xl text-xs font-semibold">
      <button id="tabPending" onclick="filterByTab('PENDING')" class="py-2.5 rounded-xl bg-emerald-600 text-white shadow-sm transition-all">
        To Dispatch (<span id="countPending">0</span>)
      </button>
      <button id="tabDispatched" onclick="filterByTab('DISPATCHED')" class="py-2.5 rounded-xl text-slate-400 hover:text-white transition-all">
        On Road (<span id="countDispatched">0</span>)
      </button>
      <button id="tabDelivered" onclick="filterByTab('DELIVERED')" class="py-2.5 rounded-xl text-slate-400 hover:text-white transition-all">
        Completed (<span id="countDelivered">0</span>)
      </button>
    </div>

    <!-- Search Box -->
    <div>
      <input type="text" id="riderSearchInput" oninput="renderDeliveries()" placeholder="Search patient name, mobile, address..." class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-emerald-500 placeholder-slate-600">
    </div>

    <!-- Deliveries List -->
    <div id="deliveriesContainer" class="space-y-3">
      <div class="py-12 text-center text-slate-500 text-xs">Loading active dispatch queue...</div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allOrders = [];
    let currentTab = 'PENDING';

    async function fetchDeliveries() {
      const { data, error } = await client
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert("Error loading orders: " + error.message);
        return;
      }

      allOrders = data || [];
      updateCounts();
      renderDeliveries();
    }

    function updateCounts() {
      const pending = allOrders.filter(o => ['New Patient', 'Prescription Received', 'Prescription Verified', 'Order Processing'].includes(o.status)).length;
      const dispatched = allOrders.filter(o => o.status === 'Dispatched').length;
      const delivered = allOrders.filter(o => ['Delivered', 'Completed', 'Feedback Submitted'].includes(o.status)).length;

      document.getElementById('countPending').innerText = pending;
      document.getElementById('countDispatched').innerText = dispatched;
      document.getElementById('countDelivered').innerText = delivered;
    }

    function filterByTab(tab) {
      currentTab = tab;
      ['tabPending', 'tabDispatched', 'tabDelivered'].forEach(id => {
        document.getElementById(id).className = "py-2.5 rounded-xl text-slate-400 hover:text-white transition-all";
      });

      if (tab === 'PENDING') document.getElementById('tabPending').className = "py-2.5 rounded-xl bg-emerald-600 text-white shadow-sm transition-all";
      if (tab === 'DISPATCHED') document.getElementById('tabDispatched').className = "py-2.5 rounded-xl bg-amber-600 text-white shadow-sm transition-all";
      if (tab === 'DELIVERED') document.getElementById('tabDelivered').className = "py-2.5 rounded-xl bg-teal-600 text-white shadow-sm transition-all";

      renderDeliveries();
    }

    function renderDeliveries() {
      const query = (document.getElementById('riderSearchInput')?.value || '').toLowerCase().trim();
      const container = document.getElementById('deliveriesContainer');

      let filtered = allOrders.filter(o => {
        if (currentTab === 'PENDING') return ['New Patient', 'Prescription Received', 'Prescription Verified', 'Order Processing'].includes(o.status);
        if (currentTab === 'DISPATCHED') return o.status === 'Dispatched';
        if (currentTab === 'DELIVERED') return ['Delivered', 'Completed', 'Feedback Submitted'].includes(o.status);
        return true;
      });

      if (query) {
        filtered = filtered.filter(o => 
          (o.patient_name || '').toLowerCase().includes(query) ||
          (o.mobile || '').includes(query) ||
          (o.delivery_address || '').toLowerCase().includes(query) ||
          (o.city || '').toLowerCase().includes(query) ||
          (o.order_id || '').toLowerCase().includes(query)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="py-12 text-center text-slate-500 text-xs font-semibold">No orders in this dispatch category.</div>';
        return;
      }

      container.innerHTML = filtered.map(order => `
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl space-y-3">
          
          <div class="flex items-start justify-between">
            <div>
              <div class="font-mono font-bold text-white text-xs">${order.order_id}</div>
              <div class="text-[11px] text-slate-400">${new Date(order.created_at).toLocaleDateString()} • Territory: <strong class="text-teal-400">${order.rep_code || 'DIRECT'}</strong></div>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-950 border border-slate-800 text-slate-300">
              ${order.status}
            </span>
          </div>

          <div class="space-y-1 text-xs">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-100 text-sm">👤 ${order.patient_name}</span>
              <a href="tel:${order.mobile}" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-bold">
                📞 Call Patient
              </a>
            </div>
            <div class="text-slate-400 font-mono text-[11px]">${order.mobile}</div>
            <div class="p-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 text-[11px]">
              📍 <strong>${order.city}:</strong> ${order.delivery_address || 'No street address specified'}
            </div>
            <div class="text-[11px] text-slate-400 pt-0.5">
              💉 Item: <strong class="text-slate-200">${order.prescribed_dose || '5mg'}</strong> (${order.device || 'Multi-Dose Pen'})
            </div>
          </div>

          <!-- Rider One-Tap Status Update Actions -->
          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-800/80">
            ${order.status !== 'Dispatched' && order.status !== 'Delivered' && order.status !== 'Completed' ? `
              <button onclick="updateOrderStatus('${order.id}', 'Dispatched')" class="w-full py-2.5 bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold transition-all">
                🚚 Mark Out for Delivery
              </button>
            ` : ''}
            
            ${order.status !== 'Delivered' && order.status !== 'Completed' ? `
              <button onclick="updateOrderStatus('${order.id}', 'Delivered')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition-all ${order.status !== 'Dispatched' ? 'col-span-1' : 'col-span-2'}">
                ✅ Mark Delivered & Collected
              </button>
            ` : `
              <div class="col-span-2 py-2 text-center text-xs font-bold text-emerald-400 bg-emerald-500/10 rounded-xl border border-emerald-500/20">
                ✓ Order Completed & Delivered
              </div>
            `}
          </div>

        </div>
      `).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      try {
        const { error } = await client
          .from('orders')
          .update({ status: newStatus })
          .eq('id', orderId);

        if (error) throw error;
        fetchDeliveries();
      } catch (err) {
        alert("Failed to update status: " + err.message);
      }
    }

    fetchDeliveries();
  </script>
</body>
</html>
