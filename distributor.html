<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Distributor & Cold-Chain Dispatch Console</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 min-h-screen font-sans text-slate-100 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Top Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-slate-900/80 border border-slate-800 p-6 rounded-3xl backdrop-blur-xl">
      <div>
        <div class="flex items-center gap-2">
          <a href="/" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold mr-1">
            🏠 Home
          </a>
          <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">Distributor & Rider <span class="text-amber-400">Dispatch</span></h1>
          <span class="px-2.5 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-bold rounded-full">Cold-Chain Hub</span>
        </div>
        <p class="text-xs text-slate-400 mt-1">Live order fulfillment, route dispatch, and real-time delivery confirmations</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchDistributorOrders()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl shadow transition-all flex items-center gap-1.5">
          <span>🔄</span> Refresh Queue
        </button>
      </div>
    </div>

    <!-- Quick Metrics Counters -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
        <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Total Dispatch Orders</div>
        <div id="statTotal" class="text-3xl font-black text-white mt-1">0</div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
        <div class="text-[11px] font-bold uppercase tracking-wider text-rose-400">Action Required (New)</div>
        <div id="statNew" class="text-3xl font-black text-rose-400 mt-1">0</div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
        <div class="text-[11px] font-bold uppercase tracking-wider text-amber-400">Out for Delivery</div>
        <div id="statDispatched" class="text-3xl font-black text-amber-400 mt-1">0</div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-2xl">
        <div class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">Delivered & Closed</div>
        <div id="statDelivered" class="text-3xl font-black text-emerald-400 mt-1">0</div>
      </div>
    </div>

    <!-- TABS, CITY FILTER & SEARCH ENGINE -->
    <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-3xl space-y-4">
      
      <!-- Stage Filter Tabs -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 p-1 bg-slate-950 rounded-2xl text-xs font-semibold border border-slate-800">
        <button id="tabPending" onclick="setTabFilter('PENDING')" class="py-2.5 rounded-xl bg-amber-600 text-white shadow-sm transition-all">
          📦 Pending Packing (<span id="tabCountPending">0</span>)
        </button>
        <button id="tabDispatched" onclick="setTabFilter('DISPATCHED')" class="py-2.5 rounded-xl text-slate-400 hover:text-white transition-all">
          🚚 Out on Road (<span id="tabCountDispatched">0</span>)
        </button>
        <button id="tabDelivered" onclick="setTabFilter('DELIVERED')" class="py-2.5 rounded-xl text-slate-400 hover:text-white transition-all">
          ✅ Delivered (<span id="tabCountDelivered">0</span>)
        </button>
        <button id="tabAll" onclick="setTabFilter('ALL')" class="py-2.5 rounded-xl text-slate-400 hover:text-white transition-all">
          📋 All Records (<span id="tabCountAll">0</span>)
        </button>
      </div>

      <!-- City & Keyword Search Filters -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pt-1">
        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1">Filter by City / Zone</label>
          <select id="cityFilter" onchange="renderDistributorOrders()" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-medium text-white outline-none focus:border-amber-500">
            <option value="ALL">All Cities & Regions</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-[11px] font-semibold text-slate-400 mb-1">Search Patient / Address / Tracking</label>
          <input type="text" id="searchInput" oninput="renderDistributorOrders()" placeholder="Search patient name, mobile, TT-ID, doctor or street address..." class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-amber-500 placeholder-slate-600">
        </div>
      </div>

    </div>

    <!-- ORDERS DISPATCH LIST CONTAINER -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <span>🛵</span> Active Dispatch Orders (<span id="filteredCount">0</span>)
        </h3>
      </div>
      
      <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full py-12 text-center text-slate-500 text-xs">
          Loading fulfillment records from database...
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allOrders = [];
    let currentTab = 'PENDING';

    async function fetchDistributorOrders() {
      const { data, error } = await client
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert("Error loading orders: " + error.message);
        return;
      }

      allOrders = data || [];
      populateCityDropdown();
      updateMetrics();
      renderDistributorOrders();
    }

    function populateCityDropdown() {
      const cityDropdown = document.getElementById('cityFilter');
      const selected = cityDropdown.value;
      const cities = [...new Set(allOrders.map(o => (o.city || '').trim()).filter(Boolean))].sort();

      cityDropdown.innerHTML = '<option value="ALL">All Cities & Regions</option>' + 
        cities.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
    }

    function updateMetrics() {
      const total = allOrders.length;
      const pending = allOrders.filter(o => ['New Patient', 'Prescription Received', 'Prescription Verified', 'Order Processing'].includes(o.status)).length;
      const newOrders = allOrders.filter(o => o.status === 'New Patient').length;
      const dispatched = allOrders.filter(o => o.status === 'Dispatched').length;
      const delivered = allOrders.filter(o => ['Delivered', 'Patient Confirmed', 'Usage Guidance Completed', 'Feedback Submitted', 'Completed'].includes(o.status)).length;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statNew').innerText = newOrders;
      document.getElementById('statDispatched').innerText = dispatched;
      document.getElementById('statDelivered').innerText = delivered;

      document.getElementById('tabCountPending').innerText = pending;
      document.getElementById('tabCountDispatched').innerText = dispatched;
      document.getElementById('tabCountDelivered').innerText = delivered;
      document.getElementById('tabCountAll').innerText = total;
    }

    function setTabFilter(tab) {
      currentTab = tab;
      ['tabPending', 'tabDispatched', 'tabDelivered', 'tabAll'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = "py-2.5 rounded-xl text-slate-400 hover:text-white transition-all";
      });

      if (tab === 'PENDING') document.getElementById('tabPending').className = "py-2.5 rounded-xl bg-amber-600 text-white shadow-sm transition-all";
      if (tab === 'DISPATCHED') document.getElementById('tabDispatched').className = "py-2.5 rounded-xl bg-blue-600 text-white shadow-sm transition-all";
      if (tab === 'DELIVERED') document.getElementById('tabDelivered').className = "py-2.5 rounded-xl bg-emerald-600 text-white shadow-sm transition-all";
      if (tab === 'ALL') document.getElementById('tabAll').className = "py-2.5 rounded-xl bg-slate-800 text-white shadow-sm transition-all";

      renderDistributorOrders();
    }

    function renderDistributorOrders() {
      const cityVal = document.getElementById('cityFilter')?.value || 'ALL';
      const searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const grid = document.getElementById('ordersGrid');

      let filtered = allOrders.filter(o => {
        if (currentTab === 'PENDING') return ['New Patient', 'Prescription Received', 'Prescription Verified', 'Order Processing'].includes(o.status);
        if (currentTab === 'DISPATCHED') return o.status === 'Dispatched';
        if (currentTab === 'DELIVERED') return ['Delivered', 'Patient Confirmed', 'Usage Guidance Completed', 'Feedback Submitted', 'Completed'].includes(o.status);
        return true;
      });

      if (cityVal !== 'ALL') {
        filtered = filtered.filter(o => (o.city || '').trim().toLowerCase() === cityVal.toLowerCase());
      }

      if (searchVal) {
        filtered = filtered.filter(o => 
          (o.patient_name || '').toLowerCase().includes(searchVal) ||
          (o.mobile || '').includes(searchVal) ||
          (o.order_id || '').toLowerCase().includes(searchVal) ||
          (o.doctor_name || '').toLowerCase().includes(searchVal) ||
          (o.delivery_address || '').toLowerCase().includes(searchVal) ||
          (o.rep_code || '').toLowerCase().includes(searchVal)
        );
      }

      document.getElementById('filteredCount').innerText = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500 text-xs font-semibold">No dispatch orders match the selected filters.</div>';
        return;
      }

      grid.innerHTML = filtered.map(order => {
        const isDispatched = order.status === 'Dispatched';
        const isDelivered = ['Delivered', 'Patient Confirmed', 'Usage Guidance Completed', 'Feedback Submitted', 'Completed'].includes(order.status);
        
        return `
          <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-4 hover:border-slate-700 transition-all">
            
            <!-- Header: Order ID & Date -->
            <div class="flex items-start justify-between gap-2 border-b border-slate-800/80 pb-3">
              <div>
                <div class="font-mono font-bold text-white text-xs flex items-center gap-1.5">
                  <span>${order.order_id}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded bg-teal-500/10 text-teal-400 border border-teal-500/20 font-sans font-bold">Territory: ${order.rep_code || 'DIRECT'}</span>
                </div>
                <div class="text-[11px] text-slate-400 mt-1">${new Date(order.created_at).toLocaleString()}</div>
              </div>
              <span class="text-[10px] font-bold px-2.5 py-1 rounded-lg ${isDelivered ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : (isDispatched ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20')}">
                ${order.status}
              </span>
            </div>

            <!-- Patient Contact & Location -->
            <div class="space-y-1.5 text-xs">
              <div class="flex items-center justify-between">
                <span class="font-bold text-slate-100 text-sm">👤 ${order.patient_name} ${order.age ? `(${order.age} yrs)` : ''}</span>
                <a href="tel:${order.mobile}" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-bold inline-flex items-center gap-1">
                  📞 Call
                </a>
              </div>
              <div class="text-slate-400 font-mono text-[11px]">${order.mobile}</div>
              <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800/80 text-slate-300 text-[11px] leading-relaxed">
                📍 <strong>${order.city}:</strong> ${order.delivery_address || 'No address provided'}
              </div>
            </div>

            <!-- Cold-Chain Item & Doctor Info -->
            <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80 text-white space-y-1.5 text-xs">
              <div class="flex items-center justify-between">
                <span class="text-slate-400 text-[11px]">Cold-Chain Item</span>
                <span class="font-bold text-amber-400">${order.prescribed_dose || '5mg'} (${order.device || 'Multi-Dose Pen'})</span>
              </div>
              <div class="flex items-center justify-between border-t border-slate-800 pt-1">
                <span class="text-slate-400 text-[11px]">Doctor</span>
                <span class="font-semibold text-slate-300">Dr. ${order.doctor_name || 'N/A'}</span>
              </div>
              ${order.prescription_url ? `
                <div class="border-t border-slate-800 pt-1 text-right">
                  <a href="${order.prescription_url}" target="_blank" class="text-[11px] text-blue-400 hover:underline">📄 View Attached Rx</a>
                </div>
              ` : ''}
            </div>

            <!-- One-Tap Action Buttons -->
            <div class="pt-1">
              ${!isDelivered ? `
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="updateOrderStatus('${order.id}', 'Dispatched')" class="py-2.5 px-2 bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1">
                    🚚 Out for Delivery
                  </button>
                  <button onclick="updateOrderStatus('${order.id}', 'Delivered')" class="py-2.5 px-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-1">
                    ✅ Delivered
                  </button>
                </div>
              ` : `
                <div class="w-full py-2.5 text-center text-xs font-bold text-emerald-400 bg-emerald-500/10 rounded-xl border border-emerald-500/20">
                  ✓ Order Handover Completed & Logged
                </div>
              `}
            </div>

          </div>
        `;
      }).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      try {
        const { error } = await client
          .from('orders')
          .update({ status: newStatus })
          .eq('id', orderId);

        if (error) throw error;
        fetchDistributorOrders();
      } catch (err) {
        alert("Failed to update status: " + err.message);
      }
    }

    fetchDistributorOrders();
  </script>
</body>
</html>
