<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Patient Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 flex justify-center items-center font-sans">

  <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6 border border-slate-100 relative">

    <!-- FORM CONTAINER -->
    <div id="fbFormSection" class="space-y-5">
      
      <!-- Top Navigation -->
      <div class="flex justify-between items-center border-b pb-4">
        <a href="/" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition-all">
          🏠 Home
        </a>
        <span class="text-[11px] font-semibold text-purple-700 bg-purple-50 px-2.5 py-1 rounded-full border border-purple-200">
          Patient Experience
        </span>
      </div>

      <!-- Header -->
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-bold text-slate-800">Your Experience Matters</h1>
        <p class="text-xs text-slate-500">Please share your feedback regarding your delivery & support service.</p>
      </div>

      <form id="feedbackForm" class="space-y-4">
        
        <!-- Mobile Verification -->
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Your Mobile Number (Used during order) *</label>
          <input type="tel" id="fb_mobile" placeholder="03XXXXXXXXX" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none">
        </div>

        <!-- Rating Questions -->
        <div class="space-y-3 pt-2">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">1. Overall Delivery & Service Experience *</label>
            <select id="overall_rating" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none">
              <option value="5">⭐⭐⭐⭐⭐ Excellent (5/5)</option>
              <option value="4">⭐⭐⭐⭐ Good (4/5)</option>
              <option value="3">⭐⭐⭐ Average (3/5)</option>
              <option value="2">⭐⭐ Poor (2/5)</option>
              <option value="1">⭐ Very Bad (1/5)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">2. Was the pen received in cold-chain box in good condition? *</label>
            <select id="cold_chain_rating" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none">
              <option value="Yes, Perfect Cold Condition">Yes, Perfect Cold Condition</option>
              <option value="Acceptable">Acceptable</option>
              <option value="No, Ice Was Melted">No, Ice Was Melted</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">3. Would you recommend TirzaTrim Patient Support? *</label>
            <select id="would_recommend" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none">
              <option value="Yes" selected>Yes, Definitely</option>
              <option value="Maybe">Maybe</option>
              <option value="No">No</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">4. Any Suggestions or Comments</label>
            <textarea id="comments" rows="3" placeholder="Tell us how we can improve..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none"></textarea>
          </div>
        </div>

        <button type="submit" id="fbSubmitBtn" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg shadow-md transition-all">
          Submit Feedback
        </button>

        <p id="fbErrorMsg" class="text-center text-xs font-medium text-rose-600 hidden"></p>
      </form>
    </div>

    <!-- THANK YOU SECTION -->
    <div id="fbThankYouSection" class="hidden text-center py-8 space-y-5">
      <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto text-3xl">
        ⭐
      </div>
      <div class="space-y-2">
        <h2 class="text-2xl font-bold text-slate-800">Thank You!</h2>
        <p class="text-xs text-slate-600">Your feedback has been recorded and will help us serve you better.</p>
      </div>
      <div class="pt-4 flex justify-center">
        <a href="/" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg shadow transition-all">
          🏠 Back to Home
        </a>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('fbSubmitBtn');
      const err = document.getElementById('fbErrorMsg');
      err.classList.add('hidden');

      btn.disabled = true;
      btn.innerText = "Submitting Feedback...";

      const mobile = document.getElementById('fb_mobile').value.trim();
      const overall = parseInt(document.getElementById('overall_rating').value);
      const coldChain = document.getElementById('cold_chain_rating').value;
      const recommend = document.getElementById('would_recommend').value;
      const comments = document.getElementById('comments').value.trim();

      try {
        // Find latest order for this mobile number
        const { data: orders, error: orderErr } = await client
          .from('orders')
          .select('id, patient_name')
          .ilike('mobile', `%${mobile.replace(/^0/, '')}%`)
          .order('created_at', { ascending: false })
          .limit(1);

        if (orderErr) throw orderErr;
        if (!orders || orders.length === 0) {
          throw new Error("No recent order found matching this mobile number. Please check the number and try again.");
        }

        const targetOrder = orders[0];

        // Insert Feedback
        const { error: insertErr } = await client
          .from('feedback')
          .insert([{
            order_id: targetOrder.id,
            overall_rating: overall,
            cold_chain_rating: coldChain,
            would_recommend: recommend,
            comments: comments
          }]);

        if (insertErr) throw insertErr;

        // Auto update order status
        await client
          .from('orders')
          .update({ status: 'Feedback Submitted' })
          .eq('id', targetOrder.id);

        document.getElementById('fbFormSection').classList.add('hidden');
        document.getElementById('fbThankYouSection').classList.remove('hidden');

      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit Feedback";
      }
    });
  </script>
</body>
</html>
