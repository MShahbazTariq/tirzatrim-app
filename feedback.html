<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Patient Experience & Feedback</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Tailwind CSS & Shared Theme Manager -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/theme.js"></script>
  <script src="/broadcast.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans text-slate-900 dark:text-slate-100 p-4 md:p-8 flex items-center justify-center transition-colors duration-200">

  <div class="max-w-md w-full bg-white/90 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 md:p-8 shadow-xl dark:shadow-2xl backdrop-blur-xl space-y-6">
    
    <!-- Top Header: Badge & Theme Toggle -->
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
      <span class="text-xs font-bold text-teal-600 dark:text-teal-400 bg-teal-500/10 px-4 py-1.5 rounded-full border border-teal-500/20">
        Verified Service Review
      </span>
      <button 
        onclick="toggleTheme()" 
        type="button"
        class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-bold transition-all flex items-center gap-1"
        title="Toggle Theme"
      >
        <span class="theme-icon">🌙</span>
      </button>
    </div>

    <!-- Title Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Your Experience <span class="text-teal-600 dark:text-teal-400">Matters</span></h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">
        Please share your feedback regarding your delivery and patient support experience.
      </p>
    </div>

    <!-- FEEDBACK FORM -->
    <form id="feedbackForm" onsubmit="submitPatientFeedback(event)" class="space-y-4">
      
      <!-- Patient Mobile Verification -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Your Mobile Number (Used during order) *</label>
        <input type="tel" id="fbMobile" required placeholder="03XXXXXXXXX" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white font-mono outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
      </div>

      <!-- 1. Overall Delivery & Service Experience -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">1. Overall Delivery & Service Experience *</label>
        <select id="fbOverallRating" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs font-bold text-amber-500 dark:text-amber-400 outline-none focus:border-teal-500 transition-all">
          <option value="5">⭐⭐⭐⭐⭐ Excellent (5/5)</option>
          <option value="4">⭐⭐⭐⭐ Good (4/5)</option>
          <option value="3">⭐⭐⭐ Satisfactory (3/5)</option>
          <option value="2">⭐⭐ Needs Improvement (2/5)</option>
          <option value="1">⭐ Poor (1/5)</option>
        </select>
      </div>

      <!-- 2. Cold-Chain Condition -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">2. Was the pen received in cold-chain box in good condition? *</label>
        <select id="fbColdChain" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 transition-all">
          <option value="Yes, Perfect Cold Condition">Yes, Perfect Cold Condition</option>
          <option value="Yes, Cool">Yes, Cool</option>
          <option value="No, Box Was Warm">No, Box Was Warm</option>
        </select>
      </div>

      <!-- 3. Recommendation -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">3. Would you recommend TirzaTrim Patient Support? *</label>
        <select id="fbRecommend" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 transition-all">
          <option value="Yes, Definitely">Yes, Definitely</option>
          <option value="Maybe">Maybe</option>
          <option value="No">No</option>
        </select>
      </div>

      <!-- 4. Comments -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">4. Any Suggestions or Comments</label>
        <textarea id="fbComments" rows="3" placeholder="Share your experience..." class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all resize-none"></textarea>
      </div>

      <!-- Submit Action -->
      <div class="pt-2 space-y-3">
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 text-white text-xs md:text-sm font-bold rounded-2xl shadow-lg shadow-teal-600/20 transition-all flex items-center justify-center gap-2">
          <span>⭐</span>
          <span>Submit Feedback</span>
        </button>
        <p id="statusMsg" class="text-xs text-center font-medium hidden"></p>
      </div>

    </form>

    <!-- Success Screen (With Close Button) -->
    <div id="successView" class="text-center space-y-4 py-6 hidden">
      <div class="w-16 h-16 rounded-3xl bg-teal-500/10 border border-teal-500/20 text-3xl flex items-center justify-center mx-auto text-teal-600 dark:text-teal-400">
        ⭐
      </div>
      <div class="space-y-1">
        <h2 class="text-xl font-black text-slate-900 dark:text-white">Thank You for Your Feedback!</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mx-auto">
          Your feedback has been verified and shared with your attending physician and patient care team.
        </p>
      </div>
      <div class="pt-3 max-w-xs mx-auto">
        <button onclick="closeCurrentWindow()" class="w-full py-3 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 transition-all flex items-center justify-center gap-1.5">
          <span>✕</span> Close Window
        </button>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function cleanPhone(phone) {
      if (!phone) return '';
      let cleaned = phone.replace(/\D/g, '');
      if (cleaned.startsWith('92')) cleaned = '0' + cleaned.substring(2);
      return cleaned;
    }

    async function submitPatientFeedback(e) {
      e.preventDefault();
      const statusEl = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      statusEl.className = "text-xs text-center font-medium text-amber-500 dark:text-amber-400";
      statusEl.innerText = "Verifying order and saving feedback...";
      statusEl.classList.remove('hidden');
      submitBtn.disabled = true;

      const rawMobile = document.getElementById('fbMobile').value.trim();
      const normalizedMobile = cleanPhone(rawMobile);
      const overall_rating = parseInt(document.getElementById('fbOverallRating').value) || 5;
      const cold_chain_rating = document.getElementById('fbColdChain').value;
      const recommendation = document.getElementById('fbRecommend').value;
      const comments = document.getElementById('fbComments').value.trim();

      try {
        // 1. Locate the patient's existing order
        const { data: matchedOrders, error: findErr } = await client
          .from('orders')
          .select('id, patient_name')
          .ilike('mobile', `%${normalizedMobile.slice(-9)}%`)
          .order('created_at', { ascending: false })
          .limit(1);

        if (findErr) throw findErr;
        if (!matchedOrders || matchedOrders.length === 0) {
          throw new Error("No active order found with this mobile number. Please check your number.");
        }

        const order = matchedOrders[0];

        // 2. Insert into feedback table
        const { error: insertErr } = await client
          .from('feedback')
          .insert([{
            order_id: order.id,
            overall_rating: overall_rating,
            cold_chain_rating: cold_chain_rating,
            comments: `[Recommend: ${recommendation}] ${comments}`
          }]);

        if (insertErr) throw insertErr;

        // 3. Mark the order status as 'Feedback Submitted'
        await client
          .from('orders')
          .update({ status: 'Feedback Submitted' })
          .eq('id', order.id);

        // Show Success Screen
        document.getElementById('feedbackForm').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');

      } catch (err) {
        statusEl.className = "text-xs text-center font-medium text-rose-500";
        statusEl.innerText = err.message;
        submitBtn.disabled = false;
      }
    }

    function closeCurrentWindow() {
      window.close();
      setTimeout(() => {
        document.body.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 font-sans text-center transition-colors duration-200">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl max-w-sm w-full space-y-3 shadow-xl">
              <div class="text-3xl text-emerald-600 dark:text-emerald-400">✓</div>
              <h3 class="text-base font-bold text-slate-900 dark:text-white">Feedback Submitted</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Thank you! You may now safely close this browser tab.</p>
            </div>
          </div>
        `;
      }, 300);
    }

    checkGlobalBroadcast('patient');
  </script>
</body>
</html>
