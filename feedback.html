<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Patient Service Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 flex justify-center">

  <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6 border border-slate-100">
    <!-- Header -->
    <div class="text-center space-y-2 border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-800">Patient Experience Feedback</h1>
      <p class="text-xs text-slate-500">Help us improve our patient support and delivery services.</p>
    </div>

    <!-- Form -->
    <form id="feedbackForm" class="space-y-5">
      
      <!-- Order ID / Mobile Reference -->
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Your Mobile Number *</label>
        <input type="tel" id="mobile" placeholder="03XXXXXXXXX" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>

      <!-- Overall Rating -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-2">1. How would you rate your overall experience? *</label>
        <div class="flex gap-2">
          <select id="overall_rating" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
            <option value="4">⭐⭐⭐⭐ (4 - Good)</option>
            <option value="3">⭐⭐⭐ (3 - Average)</option>
            <option value="2">⭐⭐ (2 - Poor)</option>
            <option value="1">⭐ (1 - Very Poor)</option>
          </select>
        </div>
      </div>

      <!-- Delivery Rating -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-2">2. How satisfied are you with the delivery service? *</label>
        <select id="delivery_rating" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
          <option value="4">⭐⭐⭐⭐ (4 - Good)</option>
          <option value="3">⭐⭐⭐ (3 - Average)</option>
          <option value="2">⭐⭐ (2 - Poor)</option>
          <option value="1">⭐ (1 - Very Poor)</option>
        </select>
      </div>

      <!-- Support & Guidance Rating -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-2">3. Was the usage guidance clear and helpful? *</label>
        <select id="guidance_rating" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="5">⭐⭐⭐⭐⭐ (5 - Extremely Clear)</option>
          <option value="4">⭐⭐⭐⭐ (4 - Clear)</option>
          <option value="3">⭐⭐⭐ (3 - Moderately Clear)</option>
          <option value="2">⭐⭐ (2 - Difficult to Understand)</option>
          <option value="1">⭐ (1 - Not Helpful)</option>
        </select>
      </div>

      <!-- Recommendation -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-2">4. Would you recommend this service? *</label>
        <select id="would_recommend" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="Yes" selected>Yes, definitely</option>
          <option value="Maybe">Maybe</option>
          <option value="No">No</option>
        </select>
      </div>

      <!-- Comments -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Additional Comments / Suggestions</label>
        <textarea id="comments" rows="3" placeholder="Share your experience..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-md transition-all">
        Submit Feedback
      </button>

      <p id="statusMsg" class="text-center text-sm font-medium hidden"></p>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusMsg.classList.add('hidden');

      try {
        const mobile = document.getElementById('mobile').value.trim();

        // 1. Find the latest order for this patient mobile number
        const { data: orders, error: orderErr } = await client
          .from('orders')
          .select('id, doctor_id, doctor_name')
          .eq('mobile', mobile)
          .order('created_at', { ascending: false })
          .limit(1);

        if (orderErr) throw orderErr;
        if (!orders || orders.length === 0) {
          throw new Error("No existing order found for this mobile number. Please check the number and try again.");
        }

        const currentOrder = orders[0];

        // 2. Insert into feedback table
        const { error: insertError } = await client
          .from('feedback')
          .insert([{
            order_id: currentOrder.id,
            overall_rating: parseInt(document.getElementById('overall_rating').value),
            delivery_rating: parseInt(document.getElementById('delivery_rating').value),
            product_guidance_rating: parseInt(document.getElementById('guidance_rating').value),
            support_rating: parseInt(document.getElementById('guidance_rating').value),
            would_recommend: document.getElementById('would_recommend').value,
            comments: document.getElementById('comments').value
          }]);

        if (insertError) throw insertError;

        // 3. Update order status to Feedback Submitted
        await client
          .from('orders')
          .update({ status: 'Feedback Submitted' })
          .eq('id', currentOrder.id);

        statusMsg.innerText = "Thank you! Your feedback has been recorded successfully.";
        statusMsg.className = "text-center text-sm font-medium text-emerald-600 block";
        document.getElementById('feedbackForm').reset();

      } catch (err) {
        statusMsg.innerText = "Error: " + err.message;
        statusMsg.className = "text-center text-sm font-medium text-rose-600 block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Feedback";
      }
    });
  </script>
</body>
</html>
