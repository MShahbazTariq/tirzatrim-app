<script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentHos = JSON.parse(sessionStorage.getItem('tt_current_hos') || 'null');
    let allOrders = [];
    let regionalManagers = [];
    let regionalReps = [];
    let feedbackMap = {};
    let activeFilteredOrders = [];
    let chartInstance = null;

    let currentDateScope = "MTD";
    let filterStartDate = null;
    let filterEndDate = null;

    function getLocalDateKey(dateInput) {
      const d = dateInput ? new Date(dateInput) : new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function showAuthTab(type) {
      document.getElementById('authErrorMsg').classList.add('hidden');
      if (type === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('loginTabBtn').className = "py-2 rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
        document.getElementById('signupTabBtn').className = "py-2 rounded-lg text-slate-400 hover:text-white transition-all";
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('signupTabBtn').className = "py-2 rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
        document.getElementById('loginTabBtn').className = "py-2 rounded-lg text-slate-400 hover:text-white transition-all";
      }
    }

    function checkHosSession() {
      if (currentHos && currentHos.sap_id) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardContent').classList.remove('hidden');
        document.getElementById('hosNameDisplay').innerHTML = `${currentHos.full_name} <span class="text-indigo-400">(${currentHos.region})</span>`;
        document.getElementById('hosRegionBadge').innerText = `${currentHos.region} Region`;
        document.getElementById('hosSapDisplay').innerText = currentHos.sap_id;
        initDates();
        fetchEverything();
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('dashboardContent').classList.add('hidden');
      }
    }

    async function handleHosSignup(e) {
      e.preventDefault();
      const err = document.getElementById('authErrorMsg');
      err.classList.add('hidden');

      const full_name = document.getElementById('regName').value.trim();
      const region = document.getElementById('regRegion').value;
      const team_name = document.getElementById('regTeam').value.trim().toUpperCase();
      const sap_id = document.getElementById('regSap').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const { data, error } = await client
          .from('hos')
          .insert([{ full_name, region, team_name, sap_id, password }])
          .select();

        if (error) {
          if (error.message.includes('unique')) throw new Error(`HOS SAP ID '${sap_id}' is already registered.`);
          throw error;
        }

        currentHos = data[0];
        sessionStorage.setItem('tt_current_hos', JSON.stringify(currentHos));
        checkHosSession();
      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      }
    }

    async function handleHosLogin(e) {
      e.preventDefault();
      const err = document.getElementById('authErrorMsg');
      err.classList.add('hidden');

      const sapId = document.getElementById('loginSap').value.trim();
      const pass = document.getElementById('loginPassword').value;

      try {
        const { data, error } = await client
          .from('hos')
          .select('*')
          .eq('sap_id', sapId)
          .eq('password', pass)
          .limit(1);

        if (error) throw error;
        if (!data || data.length === 0) throw new Error('Invalid HOS SAP ID or Password.');

        currentHos = data[0];
        sessionStorage.setItem('tt_current_hos', JSON.stringify(currentHos));
        checkHosSession();
      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      }
    }

    function handleHosLogout() {
      sessionStorage.removeItem('tt_current_hos');
      currentHos = null;
      checkHosSession();
    }

    function initDates() {
      setDatePreset('MTD');
    }

    function setDatePreset(type) {
      currentDateScope = type;
      const today = new Date();

      ['Today', 'Yesterday', '7Days', 'MTD', 'All'].forEach(id => {
        const el = document.getElementById(`btnDate${id}`);
        if (el) el.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all";
      });

      if (type === 'TODAY') {
        document.getElementById('btnDateToday').className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
        filterStartDate = getLocalDateKey(today);
        filterEndDate = getLocalDateKey(today);
        document.getElementById('dateScopeBadge').innerText = "Showing: Today (" + filterStartDate + ")";
      } else if (type === 'YESTERDAY') {
        document.getElementById('btnDateYesterday').className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
        const y = new Date();
        y.setDate(y.getDate() - 1);
        filterStartDate = getLocalDateKey(y);
        filterEndDate = getLocalDateKey(y);
        document.getElementById('dateScopeBadge').innerText = "Showing: Yesterday (" + filterStartDate + ")";
      } else if (type === 'LAST7') {
        document.getElementById('btnDate7Days').className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
        const last7 = new Date();
        last7.setDate(last7.getDate() - 6);
        filterStartDate = getLocalDateKey(last7);
        filterEndDate = getLocalDateKey(today);
        document.getElementById('dateScopeBadge').innerText = `Showing: Last 7 Days (${filterStartDate} to ${filterEndDate})`;
      } else if (type === 'MTD') {
        document.getElementById('btnDateMTD').className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        filterStartDate = getLocalDateKey(firstDay);
        filterEndDate = getLocalDateKey(today);
        document.getElementById('dateScopeBadge').innerText = `Showing: Month to Date (${filterStartDate} to ${filterEndDate})`;
      } else if (type === 'ALL') {
        document.getElementById('btnDateAll').className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm transition-all";
        filterStartDate = null;
        filterEndDate = null;
        document.getElementById('dateScopeBadge').innerText = "Showing: All Time (Complete Region)";
      }

      document.getElementById('calendarFromDate').value = filterStartDate || '';
      document.getElementById('calendarToDate').value = filterEndDate || '';

      applyAllFilters();
    }

    function onCustomDateSelected() {
      const from = document.getElementById('calendarFromDate').value;
      const to = document.getElementById('calendarToDate').value;

      if (from && to) {
        filterStartDate = from;
        filterEndDate = to;
        currentDateScope = "CUSTOM";
        
        ['Today', 'Yesterday', '7Days', 'MTD', 'All'].forEach(id => {
          const el = document.getElementById(`btnDate${id}`);
          if (el) el.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all";
        });

        document.getElementById('dateScopeBadge').innerText = `Showing Custom: ${from} to ${to}`;
        applyAllFilters();
      }
    }

    function renderStars(rating) {
      if (!rating) return '';
      return '⭐'.repeat(rating);
    }

    async function fetchEverything() {
      if (!currentHos) return;

      // 1. Fetch ZSMs belonging to this HOS Region
      const { data: managers } = await client
        .from('managers')
        .select('*')
        .eq('region', currentHos.region);

      regionalManagers = managers || [];
      const managerSaps = regionalManagers.map(m => m.manager_sap_id);

      // 2. Fetch Orders for this region
      let query = client.from('orders').select('*').order('created_at', { ascending: false });
      if (managerSaps.length > 0) {
        query = query.in('manager_sap_id', managerSaps);
      }
      const { data: orders } = await query;
      allOrders = orders || [];

      // 3. Fetch Reps under this region's ZSMs
      if (managerSaps.length > 0) {
        const { data: reps } = await client.from('reps').select('*').in('manager_sap_id', managerSaps);
        regionalReps = reps || [];
      } else {
        regionalReps = [];
      }

      // 4. Feedbacks
      const { data: feedbacks } = await client.from('feedback').select('*');
      feedbackMap = {};
      (feedbacks || []).forEach(f => { feedbackMap[f.order_id] = f; });

      populateManagerDropdown();
      populateRepDropdown();
      applyAllFilters();
    }

    function populateManagerDropdown() {
      const mgrSelect = document.getElementById('filterManager');
      mgrSelect.innerHTML = '<option value="ALL">All ZSMs in My Region</option>' +
        regionalManagers.map(m => `<option value="${m.manager_sap_id}">${m.full_name} (${m.zone_region || 'Zone'})</option>`).join('');
    }

    function populateRepDropdown() {
      const selectedManagerSap = document.getElementById('filterManager').value;
      const repSelect = document.getElementById('filterRep');

      let filteredReps = regionalReps;
      if (selectedManagerSap !== 'ALL') {
        filteredReps = regionalReps.filter(r => r.manager_sap_id === selectedManagerSap);
      }

      repSelect.innerHTML = '<option value="ALL">All Reps in Selection</option>' +
        filteredReps.map(r => `<option value="${r.territory_code}">${r.full_name} (${r.territory_code})</option>`).join('');
    }

    function onManagerChange() {
      populateRepDropdown();
      applyAllFilters();
    }

    function applyAllFilters() {
      const managerSap = document.getElementById('filterManager').value;
      const repCode = document.getElementById('filterRep').value;
      const searchTerm = (document.getElementById('globalSearchInput')?.value || '').toLowerCase().trim();

      const hierarchyMatchedOrders = allOrders.filter(o => {
        const matchesManager = managerSap === 'ALL' || o.manager_sap_id === managerSap;
        const matchesRep = repCode === 'ALL' || o.rep_code === repCode;
        const matchesSearch = !searchTerm ||
          (o.patient_name || '').toLowerCase().includes(searchTerm) ||
          (o.mobile || '').includes(searchTerm) ||
          (o.order_id || '').toLowerCase().includes(searchTerm) ||
          (o.rep_code || '').toLowerCase().includes(searchTerm) ||
          (o.doctor_name || '').toLowerCase().includes(searchTerm) ||
          (o.city || '').toLowerCase().includes(searchTerm) ||
          (o.delivery_address || '').toLowerCase().includes(searchTerm);

        return matchesManager && matchesRep && matchesSearch;
      });

      activeFilteredOrders = hierarchyMatchedOrders.filter(o => {
        const orderDateStr = getLocalDateKey(o.created_at);
        let matchesDate = true;
        if (filterStartDate && filterEndDate) {
          matchesDate = orderDateStr >= filterStartDate && orderDateStr <= filterEndDate;
        }
        return matchesDate;
      });

      updateMetrics();
      updateDailyChart(hierarchyMatchedOrders);
      updateSummaries();
      renderCards();
    }

    function updateMetrics() {
      const total = activeFilteredOrders.length;
      const delivered = activeFilteredOrders.filter(o => ['Delivered', 'Completed', 'Feedback Submitted'].includes(o.status)).length;
      const inProcess = total - delivered;

      document.getElementById('statTotal').innerText = total;
      document.getElementById('statProcess').innerText = inProcess;
      document.getElementById('statDelivered').innerText = delivered;
      document.getElementById('filteredCount').innerText = total;

      const ratings = activeFilteredOrders.map(o => feedbackMap[o.id]?.overall_rating).filter(r => r > 0);
      if (ratings.length > 0) {
        const avg = (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1);
        document.getElementById('statRating').innerText = `${avg} ⭐`;
      } else {
        document.getElementById('statRating').innerText = '5.0 ⭐';
      }
    }

    function updateDailyChart(ordersToGraph) {
      const daysCount = {};
      const datesList = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = getLocalDateKey(d);
        daysCount[key] = 0;
        datesList.push(key);
      }

      ordersToGraph.forEach(o => {
        const orderDate = getLocalDateKey(o.created_at);
        if (daysCount[orderDate] !== undefined) {
          daysCount[orderDate]++;
        }
      });

      const labels = datesList.map(dateStr => {
        const parts = dateStr.split('-');
        return `${parts[2]}/${parts[1]}`;
      });
      const dataPoints = datesList.map(d => daysCount[d]);

      const ctx = document.getElementById('dailyEnrollmentChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Patients Enrolled',
            data: dataPoints,
            backgroundColor: 'rgba(99, 102, 241, 0.85)',
            hoverBackgroundColor: 'rgba(129, 140, 248, 1)',
            borderRadius: 6,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#0f172a',
              titleColor: '#818cf8',
              bodyColor: '#ffffff',
              borderColor: '#334155',
              borderWidth: 1,
              padding: 10,
              displayColors: false
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8', font: { size: 10 } }
            },
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              ticks: { color: '#94a3b8', font: { size: 10 }, precision: 0 }
            }
          }
        }
      });
    }

    function updateSummaries() {
      const docCount = {};
      activeFilteredOrders.forEach(o => {
        const d = (o.doctor_name || 'Unassigned').trim();
        docCount[d] = (docCount[d] || 0) + 1;
      });
      const sortedDocs = Object.entries(docCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
      
      document.getElementById('topDoctorsList').innerHTML = sortedDocs.length ? sortedDocs.map(([doc, count], idx) => `
        <div class="flex items-center justify-between py-2">
          <span class="font-semibold text-slate-200">#${idx + 1} Dr. ${doc.replace(/^Dr\.?\s*/i, '')}</span>
          <span class="font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-0.5 rounded-full border border-indigo-500/20">${count} Patients</span>
        </div>
      `).join('') : '<div class="text-slate-500 py-2 text-center">No doctor records in this date window.</div>';

      const doseCount = {};
      activeFilteredOrders.forEach(o => {
        const dose = o.prescribed_dose || 'Unspecified';
        doseCount[dose] = (doseCount[dose] || 0) + 1;
      });
      document.getElementById('doseDistributionList').innerHTML = Object.entries(doseCount).length ? Object.entries(doseCount).map(([dose, count]) => `
        <div class="flex items-center justify-between py-2">
          <span class="font-semibold text-slate-300">TirzaTrim ${dose}</span>
          <span class="font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-0.5 rounded-full border border-indigo-500/20">${count} Prescriptions</span>
        </div>
      `).join('') : '<div class="text-slate-500 py-2 text-center">No dosage records in this date window.</div>';
    }

    function renderCards() {
      const grid = document.getElementById('hosCardsGrid');
      if (activeFilteredOrders.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500 text-sm">No patient records found matching your selection.</div>';
        return;
      }

      grid.innerHTML = activeFilteredOrders.map(order => {
        const fb = feedbackMap[order.id];
        return `
          <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-4 hover:border-slate-700 transition-all">
            <div class="flex items-start justify-between gap-2 border-b border-slate-800/80 pb-3">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-mono font-bold text-white text-xs">${order.order_id || 'N/A'}</span>
                  <span class="px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 text-[10px] font-bold border border-indigo-500/20">Rep: ${order.rep_code || 'Direct'}</span>
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5">${new Date(order.created_at).toLocaleDateString()}</div>
              </div>
              <span class="inline-block px-2.5 py-1 text-[11px] font-bold rounded-lg bg-slate-800 text-indigo-400 border border-slate-700">
                ${order.status}
              </span>
            </div>

            <div class="space-y-1.5 text-xs">
              <div class="font-bold text-slate-100 text-sm">👤 ${order.patient_name} ${order.age ? `(${order.age} yrs)` : ''}</div>
              <div class="text-slate-400 font-mono text-[11px]">${order.mobile}</div>
              <div class="p-2 rounded-xl bg-slate-950 border border-slate-800/80 text-slate-300 text-[11px]">
                📍 <strong>${order.city}:</strong> ${order.delivery_address || 'No street address'}
              </div>
            </div>

            <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/80 text-white space-y-1.5 text-xs">
              <div class="flex items-center justify-between">
                <span class="text-slate-400 text-[11px]">Doctor</span>
                <span class="font-bold text-indigo-300">Dr. ${order.doctor_name || 'N/A'}</span>
              </div>
              <div class="flex items-center justify-between border-t border-slate-800 pt-1">
                <span class="text-slate-400 text-[11px]">Dose & Device</span>
                <span class="font-bold text-slate-200">${order.prescribed_dose || 'N/A'} (${order.device || 'N/A'})</span>
              </div>
            </div>

            <div class="text-[11px] flex items-center justify-between border-t border-slate-800 pt-2">
              <span class="text-slate-400 font-medium">Verified Feedback:</span>
              <span>${fb ? `<span class="text-amber-400 font-bold">${renderStars(fb.overall_rating)}</span>` : '<span class="text-slate-500 italic">Pending</span>'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function exportFilteredCSV() {
      if (!activeFilteredOrders || activeFilteredOrders.length === 0) return alert("No records to export.");
      let csv = "Order ID,Date,Region,Manager SAP,Rep Code,Patient Name,Mobile,City,Doctor,Dose,Device,Status\n";
      activeFilteredOrders.forEach(o => {
        csv += `"${o.order_id || ''}","${new Date(o.created_at).toLocaleDateString()}","${currentHos.region}","${o.manager_sap_id || ''}","${o.rep_code || ''}","${o.patient_name || ''}","${o.mobile || ''}","${o.city || ''}","${o.doctor_name || ''}","${o.prescribed_dose || ''}","${o.device || ''}","${o.status || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `TirzaTrim_HOS_${currentHos.region}_${currentDateScope}_Export.csv`;
      a.click();
    }

    checkHosSession();
  </script>
</body>
</html>
