<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Head of Sales Portal</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="fixed inset-0 bg-slate-900 bg-opacity-80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl border space-y-6 relative">
      <a href="/" class="absolute top-5 left-5 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition-all">
        🏠 Home
      </a>
      <div class="text-center space-y-1 pt-4">
        <h2 class="text-2xl font-bold text-slate-800">Head of Sales Hub</h2>
        <p class="text-xs text-slate-500">Supervisory access for Central, North & South Regions</p>
      </div>

      <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl text-xs font-semibold">
        <button id="loginTabBtn" onclick="showAuthTab('login')" class="py-2 rounded-lg bg-white shadow-sm text-slate-800 transition-all">
          HOS Login
        </button>
        <button id="signupTabBtn" onclick="showAuthTab('signup')" class="py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all">
          New HOS Signup
        </button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" onsubmit="handleHosLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">HOS SAP ID *</label>
          <input type="text" id="loginSap" placeholder="e.g. 8001" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500 font-semibold">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Password *</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-lg shadow transition-all">
          Access Regional Hub
        </button>
      </form>

      <!-- SIGNUP -->
      <form id="signupForm" onsubmit="handleHosSignup(event)" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Full Name *</label>
          <input type="text" id="regName" placeholder="e.g. Head of Sales Name" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Region *</label>
            <select id="regRegion" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500 font-semibold">
              <option value="Central">Central</option>
              <option value="North">North</option>
              <option value="South">South</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Team *</label>
            <input type="text" id="regTeam" placeholder="e.g. QASWA" required class="w-full px-3 py-2 border rounded-lg text-sm uppercase outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">HOS SAP ID *</label>
            <input type="text" id="regSap" placeholder="e.g. 8001" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Password *</label>
            <input type="password" id="regPassword" placeholder="Create password" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold text-sm rounded-lg shadow transition-all mt-2">
          Register HOS Account
        </button>
      </form>
      <p id="authErrorMsg" class="text-center text-xs font-medium text-rose-600 hidden"></p>
    </div>
  </div>

  <!-- HOS MAIN DASHBOARD -->
  <div id="dashboardContent" class="p-4 md:p-6 max-w-7xl mx-auto space-y-5 hidden">
    
    <!-- Top Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border">
      <div>
        <div class="flex items-center gap-2">
          <a href="/" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all mr-1">
            🏠 Home
          </a>
          <h1 class="text-xl md:text-2xl font-extrabold text-slate-900" id="hosNameDisplay">Regional Sales Hub</h1>
          <span id="hosRegionBadge" class="px-2.5 py-0.5 bg-indigo-100 text-indigo-800 text-xs font-bold rounded-full">Region</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">Supervisory Level: <strong class="text-slate-700">Head of Sales</strong> | SAP ID: <strong id="hosSapDisplay" class="text-slate-700">-</strong></p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="exportRegionalCSV()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-xl shadow-sm">
          📊 Export Regional CSV
        </button>
        <button onclick="fetchHosData()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-sm">
          🔄 Refresh
        </button>
        <button onclick="handleHosLogout()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold rounded-xl border border-rose-200">
          🚪 Logout
        </button>
      </div>
    </div>

    <!-- Regional Metrics -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Total Region Orders</div>
        <div id="statTotal" class="text-2xl font-black text-slate-800 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">In Process</div>
        <div id="statProcess" class="text-2xl font-black text-amber-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Delivered / Confirmed</div>
        <div id="statDelivered" class="text-2xl font-black text-emerald-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Feedback Submissions</div>
        <div id="statFeedback" class="text-2xl font-black text-purple-600 mt-1">0</div>
      </div>
    </div>

    <!-- Search & Zone Filters -->
    <div class="bg-white p-3 md:p-4 rounded-2xl border shadow-sm flex flex-col md:flex-row gap-2.5 items-center justify-between">
      <div class="w-full md:w-1/2 relative">
        <input type="text" id="hosSearchInput" oninput="renderHosCards()" placeholder="🔍 Search patient, rep, doctor, zone, or city..." class="w-full px-3.5 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50/50">
      </div>
      <div class="w-full md:w-auto flex flex-wrap gap-2">
        <select id="hosManagerFilter" onchange="renderHosCards()" class="px-3.5 py-2 border rounded-xl text-xs font-semibold bg-slate-50 outline-none text-slate-700">
          <option value="ALL">All Zonal Managers</option>
        </select>
        <select id="hosStatusFilter" onchange="renderHosCards()" class="px-3.5 py-2 border rounded-xl text-xs font-medium bg-slate-50 outline-none text-slate-700">
          <option value="ALL">All Statuses</option>
          <option value="New Patient">New Patient</option>
          <option value="Prescription Verified">Prescription Verified</option>
          <option value="Order Processing">Order Processing</option>
          <option value="Delivered">Delivered</option>
          <option value="Feedback Submitted">Feedback Submitted</option>
        </select>
      </div>
    </div>

    <!-- Cards Container -->
    <div id="hosCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full py-12 text-center text-slate-400 text-sm">
        Loading regional records...
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentHos = JSON.parse(sessionStorage.getItem('tt_current_hos') || 'null');
    let regionalOrders = [];
    let regionalManagers = [];
    let feedbackMap = {};

    function showAuthTab(type) {
      document.getElementById('authErrorMsg').classList.add('hidden');
      if (type === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('loginTabBtn').className = "py-2 rounded-lg bg-white shadow-sm text-slate-800 transition-all";
        document.getElementById('signupTabBtn').className = "py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all";
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('signupTabBtn').className = "py-2 rounded-lg bg-white shadow-sm text-slate-800 transition-all";
        document.getElementById('loginTabBtn').className = "py-2 rounded-lg text-slate-500 hover:text-slate-800 transition-all";
      }
    }

    function checkHosSession() {
      if (currentHos && currentHos.sap_id) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardContent').classList.remove('hidden');
        document.getElementById('hosNameDisplay').innerText = `${currentHos.full_name} (${currentHos.region})`;
        document.getElementById('hosRegionBadge').innerText = `${currentHos.region} Region`;
        document.getElementById('hosSapDisplay').innerText = currentHos.sap_id;
        fetchHosData();
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('dashboardContent').classList.add('hidden');
      }
    }

    async function handleHosSignup(e) {
      e.preventDefault();
      const err = document.getElementById('authErrorMsg');
      err.classList.add('hidden');

      const full_name = document.getElementById('regName').value.trim();
      const region = document.getElementById('regRegion').value;
      const team_name = document.getElementById('regTeam').value.trim().toUpperCase();
      const sap_id = document.getElementById('regSap').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const { data, error } = await client
          .from('hos')
          .insert([{ full_name, region, team_name, sap_id, password }])
          .select();

        if (error) {
          if (error.message.includes('unique')) throw new Error(`HOS SAP ID '${sap_id}' is already registered.`);
          throw error;
        }

        currentHos = data[0];
        sessionStorage.setItem('tt_current_hos', JSON.stringify(currentHos));
        checkHosSession();
      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      }
    }

    async function handleHosLogin(e) {
      e.preventDefault();
      const err = document.getElementById('authErrorMsg');
      err.classList.add('hidden');

      const sapId = document.getElementById('loginSap').value.trim();
      const pass = document.getElementById('loginPassword').value;

      try {
        const { data, error } = await client
          .from('hos')
          .select('*')
          .eq('sap_id', sapId)
          .eq('password', pass)
          .limit(1);

        if (error) throw error;
        if (!data || data.length === 0) throw new Error('Invalid HOS SAP ID or Password.');

        currentHos = data[0];
        sessionStorage.setItem('tt_current_hos', JSON.stringify(currentHos));
        checkHosSession();
      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      }
    }

    function handleHosLogout() {
      sessionStorage.removeItem('tt_current_hos');
      currentHos = null;
      checkHosSession();
    }

    function renderStars(rating) {
      if (!rating) return '';
      return '⭐'.repeat(rating);
    }

    async function fetchHosData() {
      if (!currentHos) return;
      const grid = document.getElementById('hosCardsGrid');
      grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-sm">Loading regional records...</div>';

      // 1. Fetch Zonal Managers under this region
      const { data: managers } = await client
        .from('managers')
        .select('*')
        .eq('region', currentHos.region);

      regionalManagers = managers || [];
      const managerSapIds = regionalManagers.map(m => m.manager_sap_id);

      const mgrFilter = document.getElementById('hosManagerFilter');
      mgrFilter.innerHTML = '<option value="ALL">All Zonal Managers</option>' +
        regionalManagers.map(m => `<option value="${m.manager_sap_id}">${m.full_name} (${m.zone_region})</option>`).join('');

      // 2. Fetch Orders belonging to these Managers (or fallback to all if initial rollout)
      let query = client.from('orders').select('*').order('created_at', { ascending: false });
      if (managerSapIds.length > 0) {
        query = query.in('manager_sap_id', managerSapIds);
      }

      const { data: orders, error } = await query;

      if (error) {
        grid.innerHTML = `<div class="col-span-full py-8 text-center text-rose-500 text-sm">Error: ${error.message}</div>`;
        return;
      }

      regionalOrders = orders || [];

      // 3. Fetch Feedbacks
      const orderIds = regionalOrders.map(o => o.id);
      const { data: feedbacks } = await client.from('feedback').select('*').in('order_id', orderIds);

      feedbackMap = {};
      (feedbacks || []).forEach(f => { feedbackMap[f.order_id] = f; });

      renderHosCards();
    }

    function renderHosCards() {
      const selectedMgr = document.getElementById('hosManagerFilter')?.value || 'ALL';
      const selectedStatus = document.getElementById('hosStatusFilter')?.value || 'ALL';
      const searchTerm = (document.getElementById('hosSearchInput')?.value || '').toLowerCase().trim();
      const grid = document.getElementById('hosCardsGrid');

      let filtered = regionalOrders.filter(order => {
        const matchesMgr = selectedMgr === 'ALL' || order.manager_sap_id === selectedMgr;
        const matchesStatus = selectedStatus === 'ALL' || order.status === selectedStatus;
        const matchesSearch = !searchTerm ||
          (order.patient_name || '').toLowerCase().includes(searchTerm) ||
          (order.mobile || '').includes(searchTerm) ||
          (order.order_id || '').toLowerCase().includes(searchTerm) ||
          (order.rep_code || '').toLowerCase().includes(searchTerm) ||
          (order.doctor_name || '').toLowerCase().includes(searchTerm) ||
          (order.city || '').toLowerCase().includes(searchTerm);

        return matchesMgr && matchesStatus && matchesSearch;
      });

      if (!filtered || filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-sm">No orders found for this selection.</div>';
        document.getElementById('statTotal').innerText = '0';
        document.getElementById('statProcess').innerText = '0';
        document.getElementById('statDelivered').innerText = '0';
        document.getElementById('statFeedback').innerText = '0';
        return;
      }

      document.getElementById('statTotal').innerText = filtered.length;
      document.getElementById('statProcess').innerText = filtered.filter(o => ['New Patient', 'Prescription Received', 'Prescription Verified', 'Order Processing', 'Dispatched'].includes(o.status)).length;
      document.getElementById('statDelivered').innerText = filtered.filter(o => ['Delivered', 'Patient Confirmed', 'Usage Guidance Completed', 'Completed', 'Feedback Submitted'].includes(o.status)).length;
      document.getElementById('statFeedback').innerText = filtered.filter(o => feedbackMap[o.id]).length;

      grid.innerHTML = filtered.map(order => {
        const fb = feedbackMap[order.id];
        return `
          <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 flex flex-col justify-between space-y-4">
            <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-3">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-mono font-black text-slate-900 text-xs tracking-tight">${order.order_id || 'N/A'}</span>
                  <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 text-[10px] font-bold">Rep: ${order.rep_code || 'Direct'}</span>
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5">${new Date(order.created_at).toLocaleDateString()}</div>
              </div>
              <span class="inline-block px-2.5 py-1 text-[11px] font-bold rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200/60">
                ${order.status}
              </span>
            </div>

            <div class="space-y-1.5 text-xs">
              <div class="font-bold text-slate-900 text-sm">👤 ${order.patient_name} ${order.age ? `(${order.age} yrs)` : ''}</div>
              <div class="text-slate-500 font-mono text-[11px]">${order.mobile}</div>
              <div class="p-2 rounded-xl bg-slate-50 border border-slate-100 text-slate-600 text-[11px]">
                📍 <strong>${order.city}:</strong> ${order.delivery_address || 'No street address'}
              </div>
            </div>

            <div class="p-3 rounded-xl bg-slate-900 text-white space-y-1.5 text-xs">
              <div class="flex items-center justify-between">
                <span class="text-slate-400 text-[11px]">Doctor</span>
                <span class="font-bold text-emerald-300">Dr. ${order.doctor_name || 'N/A'}</span>
              </div>
              <div class="flex items-center justify-between border-t border-slate-800 pt-1">
                <span class="text-slate-400 text-[11px]">Dose & Device</span>
                <span class="font-bold text-white">${order.prescribed_dose || 'N/A'} (${order.device || 'N/A'})</span>
              </div>
            </div>

            <div class="text-[11px] flex items-center justify-between border-t border-slate-100 pt-2">
              <span class="text-slate-400 font-medium">Verified Feedback:</span>
              <span>${fb ? `<span class="text-amber-500 font-bold">${renderStars(fb.overall_rating)}</span>` : '<span class="text-slate-400 italic">Pending</span>'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function exportRegionalCSV() {
      if (!regionalOrders || regionalOrders.length === 0) {
        alert("No records to export!");
        return;
      }
      let csv = "Order ID,Date,Region,Manager SAP,Rep Code,Patient Name,Mobile,City,Doctor,Dose,Status\n";
      regionalOrders.forEach(o => {
        csv += `"${o.order_id || ''}","${new Date(o.created_at).toLocaleDateString()}","${currentHos.region}","${o.manager_sap_id || ''}","${o.rep_code || ''}","${o.patient_name || ''}","${o.mobile || ''}","${o.city || ''}","${o.doctor_name || ''}","${o.prescribed_dose || ''}","${o.status || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `TirzaTrim_${currentHos.region}_Region_Report.csv`;
      a.click();
    }

    checkHosSession();
  </script>
</body>
</html>
