<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Doctor Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header with Home Button -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-xl shadow-sm border">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <a href="/" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all">
            🏠 Home
          </a>
          <h1 class="text-2xl font-bold text-slate-800" id="portalHeader">TirzaTrim Doctor Portal</h1>
        </div>
        <p class="text-xs text-slate-500" id="portalSubheader">Patient Prescription, Delivery & Service Feedback Tracker</p>
      </div>
      <div class="flex items-center gap-2">
        <div id="searchContainer" class="hidden">
          <input type="text" id="manualDoctorInput" placeholder="Enter Doctor Name..." class="px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          <button onclick="handleManualSearch()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg ml-2">
            View Patients
          </button>
        </div>
        <button onclick="fetchDoctorPatients()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-lg">
          🔄 Refresh
        </button>
      </div>
    </div>

    <!-- Summary Metrics -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <div class="text-xs font-semibold uppercase text-slate-400">Total Referred Patients</div>
        <div id="metricTotal" class="text-2xl font-bold text-slate-800 mt-1">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <div class="text-xs font-semibold uppercase text-slate-400">Completed Deliveries</div>
        <div id="metricCompleted" class="text-2xl font-bold text-emerald-600 mt-1">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <div class="text-xs font-semibold uppercase text-slate-400">Feedback Submissions</div>
        <div id="metricFeedback" class="text-2xl font-bold text-purple-600 mt-1">0</div>
      </div>
    </div>

    <!-- Patient Records Table -->
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-xs text-slate-400 uppercase tracking-wider border-b">
            <tr>
              <th class="p-4">Patient & City</th>
              <th class="p-4">Dose & Pen Device</th>
              <th class="p-4">Status</th>
              <th class="p-4">Prescription</th>
              <th class="p-4">Patient Feedback</th>
            </tr>
          </thead>
          <tbody id="doctorTableBody" class="divide-y">
            <tr>
              <td colspan="5" class="p-6 text-center text-slate-400">Loading patient records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    let targetDoctor = urlParams.get('dr') ? urlParams.get('dr').trim() : '';

    if (targetDoctor) {
      document.getElementById('portalHeader').innerText = `${targetDoctor}'s Portal`;
      document.getElementById('portalSubheader').innerText = `Live prescription tracker and feedback for ${targetDoctor}`;
      document.getElementById('searchContainer').classList.add('hidden');
    } else {
      document.getElementById('searchContainer').classList.remove('hidden');
    }

    function handleManualSearch() {
      const val = document.getElementById('manualDoctorInput').value.trim();
      if (!val) {
        alert("Please enter a doctor name.");
        return;
      }
      targetDoctor = val;
      document.getElementById('portalHeader').innerText = `${targetDoctor}'s Portal`;
      fetchDoctorPatients();
    }

    function renderStars(rating) {
      if (!rating) return '<span class="text-xs text-slate-400 italic">No rating</span>';
      return '⭐'.repeat(rating) + ` <span class="text-xs text-slate-500">(${rating}/5)</span>`;
    }

    async function fetchDoctorPatients() {
      const tbody = document.getElementById('doctorTableBody');

      if (!targetDoctor) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500 font-medium">Please provide or search your Doctor Name to view your referred patient records.</td></tr>';
        document.getElementById('metricTotal').innerText = '0';
        document.getElementById('metricCompleted').innerText = '0';
        document.getElementById('metricFeedback').innerText = '0';
        return;
      }

      tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">Loading your patient records...</td></tr>';

      const cleanName = targetDoctor.replace(/^Dr\.?\s*/i, '').trim();

      const { data: orders, error: orderErr } = await client
        .from('orders')
        .select('*')
        .ilike('doctor_name', `%${cleanName}%`)
        .order('created_at', { ascending: false });

      if (orderErr) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-rose-500">Error: ${orderErr.message}</td></tr>`;
        return;
      }

      if (!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">No patient prescriptions found for <strong>${targetDoctor}</strong>.</td></tr>`;
        document.getElementById('metricTotal').innerText = '0';
        document.getElementById('metricCompleted').innerText = '0';
        document.getElementById('metricFeedback').innerText = '0';
        return;
      }

      const orderIds = orders.map(o => o.id);
      const { data: feedbacks } = await client
        .from('feedback')
        .select('*')
        .in('order_id', orderIds);

      const feedbackMap = {};
      (feedbacks || []).forEach(f => {
        feedbackMap[f.order_id] = f;
      });

      document.getElementById('metricTotal').innerText = orders.length;
      document.getElementById('metricCompleted').innerText = orders.filter(o => ['Delivered', 'Completed', 'Feedback Submitted'].includes(o.status)).length;
      document.getElementById('metricFeedback').innerText = feedbacks ? feedbacks.length : 0;

      tbody.innerHTML = orders.map(order => {
        const fb = feedbackMap[order.id];
        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="p-4">
              <div class="font-semibold text-slate-800">${order.patient_name} ${order.age ? `<span class="text-xs font-normal text-slate-500">(${order.age} yrs)</span>` : ''}</div>
              <div class="text-xs text-slate-400 mt-0.5">📍 ${order.city}</div>
            </td>
            <td class="p-4">
              <div class="text-xs font-bold text-emerald-600">${order.prescribed_dose || 'N/A'}</div>
              <div class="text-xs text-purple-700 font-medium mt-0.5">${order.device || 'N/A'}</div>
              <div class="text-xs text-slate-400 mt-0.5">${order.indication || ''}</div>
            </td>
            <td class="p-4">
              <span class="inline-block px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">
                ${order.status}
              </span>
            </td>
            <td class="p-4">
              ${order.prescription_url 
                ? `<a href="${order.prescription_url}" target="_blank" class="text-xs text-blue-600 underline hover:text-blue-800 font-medium">📄 View Rx</a>` 
                : '<span class="text-xs text-slate-400">None</span>'}
            </td>
            <td class="p-4">
              ${fb ? `
                <div class="text-xs font-semibold">${renderStars(fb.overall_rating)}</div>
                ${fb.comments ? `<div class="text-xs text-slate-600 italic mt-1">"${fb.comments}"</div>` : '<div class="text-xs text-slate-400 mt-1">No written comments</div>'}
                <div class="text-[11px] text-slate-400 mt-0.5">Recommend: <strong>${fb.would_recommend || 'N/A'}</strong></div>
              ` : '<span class="text-xs text-slate-400 italic">Pending feedback</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    fetchDoctorPatients();
  </script>
</body>
</html>
