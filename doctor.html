<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Doctor Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">TirzaTrim Doctor Portal</h1>
        <p class="text-xs text-slate-500">Patient Prescription & Progress Monitoring</p>
      </div>
      <div class="flex gap-2">
        <input type="text" id="doctorFilter" placeholder="Filter by Doctor Name..." oninput="fetchDoctorPatients()" class="px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        <button onclick="fetchDoctorPatients()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg">
          Refresh List
        </button>
      </div>
    </div>

    <!-- Patient Records Table -->
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-xs text-slate-400 uppercase tracking-wider border-b">
            <tr>
              <th class="p-4">Patient Name / Mobile</th>
              <th class="p-4">Indication</th>
              <th class="p-4">Current Dose</th>
              <th class="p-4">Device (Pen)</th>
              <th class="p-4">Prescription</th>
              <th class="p-4">Status</th>
            </tr>
          </thead>
          <tbody id="doctorTableBody" class="divide-y">
            <tr>
              <td colspan="6" class="p-6 text-center text-slate-400">Loading patient records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchDoctorPatients() {
      const tbody = document.getElementById('doctorTableBody');
      const filter = document.getElementById('doctorFilter').value.trim();
      
      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">Loading patient records...</td></tr>';

      let query = client.from('orders').select('*').order('created_at', { ascending: false });

      if (filter) {
        query = query.ilike('doctor_name', `%${filter}%`);
      }

      const { data: orders, error } = await query;

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-rose-500">Error: ${error.message}</td></tr>`;
        return;
      }

      if (!orders || orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">No patient records found.</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(order => `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="p-4">
            <div class="font-semibold text-slate-800">${order.patient_name}</div>
            <div class="text-xs text-slate-400">${order.mobile} • ${order.city}</div>
          </td>
          <td class="p-4 text-xs font-medium text-slate-700">${order.indication || 'N/A'}</td>
          <td class="p-4 text-xs font-bold text-emerald-600">${order.prescribed_dose || 'N/A'}</td>
          <td class="p-4 text-xs font-medium text-slate-600">${order.device || 'N/A'}</td>
          <td class="p-4">
            ${order.prescription_url 
              ? `<a href="${order.prescription_url}" target="_blank" class="text-xs text-blue-600 underline hover:text-blue-800">View Rx</a>` 
              : '<span class="text-xs text-slate-400">None</span>'}
          </td>
          <td class="p-4">
            <span class="inline-block px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">
              ${order.status}
            </span>
          </td>
        </tr>
      `).join('');
    }

    fetchDoctorPatients();
  </script>
</body>
</html>
