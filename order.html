<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Patient Prescription Order</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Tailwind CSS & Shared Theme Manager -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/theme.js"></script>
  <script src="/broadcast.js"></script>
  <script src="/notification.js"></script>
  
  <!-- Notification System -->
  <script src="/notification-center.js"></script>
  <script src="/notification-helper.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans text-slate-900 dark:text-slate-100 p-4 md:p-8 flex items-center justify-center transition-colors duration-200">

  <div class="max-w-2xl w-full bg-white/90 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 md:p-10 shadow-xl dark:shadow-2xl backdrop-blur-xl space-y-6">
    
    <!-- Top Header: Badge & Theme Toggle -->
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
      <span class="text-xs font-bold text-teal-600 dark:text-teal-400 bg-teal-500/10 px-4 py-1.5 rounded-full border border-teal-500/20">
        TirzaTrim Patient Support Care
      </span>
      <button 
        onclick="toggleTheme()" 
        type="button" 
        class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-bold transition-all flex items-center gap-1"
        title="Toggle Theme"
      >
        <span class="theme-icon">🌙</span>
      </button>
    </div>

    <!-- Title Header -->
    <div class="text-center space-y-1.5">
      <h1 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white tracking-tight">
        TirzaTrim <span class="text-teal-600 dark:text-teal-400">Patient Support</span>
      </h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 max-w-md mx-auto">
        Submit your details and prescription below to start your order.
      </p>
    </div>

    <!-- ORDER FORM -->
    <form id="patientOrderForm" onsubmit="submitPatientOrder(event)" class="space-y-6">
      
      <!-- 1. PERSONAL DETAILS -->
      <div class="space-y-3">
        <div class="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400 flex items-center gap-1.5">
          <span>👤</span> 1. PERSONAL DETAILS
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2">
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Full Name *</label>
            <input type="text" id="patientName" required placeholder="Full Name" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Age *</label>
            <input type="number" id="patientAge" required placeholder="e.g. 35" min="1" max="120" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Mobile Number (WhatsApp) *</label>
          <input type="tel" id="patientMobile" required placeholder="03XXXXXXXXX" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white font-mono outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">City / Area *</label>
            <input type="text" id="patientCity" list="citySuggestions" oninput="updateClinicSuggestions()" required placeholder="Select or type City (e.g. Lahore, Karachi)" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
            <datalist id="citySuggestions">
              <option value="Lahore"></option>
              <option value="Karachi"></option>
              <option value="Islamabad"></option>
              <option value="Rawalpindi"></option>
              <option value="Faisalabad"></option>
              <option value="Multan"></option>
              <option value="Peshawar"></option>
              <option value="Quetta"></option>
              <option value="Sialkot"></option>
              <option value="Gujranwala"></option>
              <option value="Hyderabad"></option>
              <option value="Bahawalpur"></option>
              <option value="Sargodha"></option>
            </datalist>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Delivery Address *</label>
            <input type="text" id="patientAddress" required placeholder="Street address / House #" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
          </div>
        </div>
      </div>

      <!-- 2. TREATMENT DETAILS -->
      <div class="space-y-3 pt-2">
        <div class="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400 flex items-center gap-1.5">
          <span>🩺</span> 2. TREATMENT DETAILS
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Doctor Name *</label>
            <input type="text" id="doctorName" required placeholder="e.g. Dr. Nauman J Butt" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Clinic / Hospital Name *</label>
            <input type="text" id="clinicName" list="clinicSuggestions" required placeholder="Type or select clinic" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500 placeholder-slate-400 dark:placeholder-slate-600 transition-all">
            <datalist id="clinicSuggestions"></datalist>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Indication *</label>
          <select id="patientIndication" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs font-medium text-slate-900 dark:text-white outline-none focus:border-teal-500 transition-all">
            <option value="Weight Management">Weight Management</option>
            <option value="Type 2 Diabetes">Type 2 Diabetes</option>
            <option value="Cardio-Metabolic Care">Cardio-Metabolic Care</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Prescribed Dose *</label>
            <select id="prescribedDose" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs font-bold text-slate-900 dark:text-white outline-none focus:border-teal-500 transition-all">
              <option value="2.5mg">TirzaTrim 2.5mg</option>
              <option value="5mg" selected>TirzaTrim 5mg</option>
              <option value="7.5mg">TirzaTrim 7.5mg</option>
              <option value="10mg">TirzaTrim 10mg</option>
              <option value="12.5mg">TirzaTrim 12.5mg</option>
              <option value="15mg">TirzaTrim 15mg</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Device Type *</label>
            <select id="deviceType" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs font-bold text-slate-900 dark:text-white outline-none focus:border-teal-500 transition-all">
              <option value="5mg Multi-Dose Pen">5mg Multi-Dose Pen</option>
              <option value="10mg Multi-Dose Pen">10mg Multi-Dose Pen</option>
              <option value="15mg Multi-Dose Pen">15mg Multi-Dose Pen</option>
            </select>
          </div>
        </div>

        <input type="hidden" id="territoryRepCode" value="">

        <div>
          <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Upload Prescription Photo (Optional)</label>
          <input type="file" id="prescriptionFile" accept="image/*,.pdf" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-600 dark:text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-200 dark:file:bg-slate-800 file:text-teal-600 dark:file:text-teal-400 hover:file:bg-slate-300 dark:hover:file:bg-slate-700 cursor-pointer transition-all">
        </div>
      </div>

      <!-- Submit Action -->
      <div class="pt-2 space-y-3">
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 text-white text-xs md:text-sm font-bold rounded-2xl shadow-lg shadow-teal-600/20 transition-all flex items-center justify-center gap-2">
          <span>🚀</span>
          <span>Submit Order</span>
        </button>
        <p id="submissionStatus" class="text-xs text-center font-medium hidden"></p>
      </div>

    </form>

    <!-- SUCCESS CONFIRMATION VIEW -->
    <div id="successView" class="text-center space-y-5 py-6 hidden">
      <div class="w-16 h-16 rounded-3xl bg-emerald-500/10 border border-emerald-500/20 text-3xl flex items-center justify-center mx-auto text-emerald-600 dark:text-emerald-400">
        ✓
      </div>
      <div class="space-y-1.5">
        <h2 class="text-xl font-black text-slate-900 dark:text-white">Order Received!</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">
          Your order ID is <strong id="generatedOrderId" class="text-teal-600 dark:text-teal-400 font-mono text-sm">TT-XXXXX</strong>. Our patient support team will contact you on WhatsApp shortly.
        </p>
      </div>

      <!-- Custom Actions (Submit Another & Close) -->
      <div class="pt-3 grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-md mx-auto">
        <button onclick="resetForAnotherOrder()" class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-teal-600/20 transition-all flex items-center justify-center gap-1.5">
          <span>➕</span> Submit Another Order
        </button>
        <button onclick="closeCurrentWindow()" class="w-full py-3 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 transition-all flex items-center justify-center gap-1.5">
          <span>✕</span> Close Window
        </button>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PAKISTAN_CLINICS = {
      "Lahore": [
        "IDC (Islamabad Diagnostic Centre)", "Doctors Hospital & Medical Center", "Hameed Latif Hospital", 
        "National Hospital DHA", "Shaukat Khanum Memorial Hospital", "Fatima Memorial Hospital (FMH)",
        "Services Hospital", "Mayo Hospital", "Jinnah Hospital", "Sheikh Zayed Hospital", 
        "Surgimed Hospital", "Mid City Hospital", "Omar Hospital & Cardiac Centre", "Farooq Hospital Westwood/Allama Iqbal",
        "Chughtai Medical Center", "Akram Medical Complex", "Evercare Hospital", "PAF Hospital"
      ],
      "Karachi": [
        "Aga Khan University Hospital (AKUH)", "Liaquat National Hospital", "South City Hospital", 
        "Ziauddin Hospital (Clifton/North Nazimabad)", "Indus Hospital", "Tabba Heart Institute",
        "Patel Hospital", "Civil Hospital Karachi", "Jinnah Postgraduate Medical Centre (JPMC)",
        "OMI Hospital", "National Medical Centre (NMC)", "Hashmanis Hospital", "IDC Karachi"
      ],
      "Islamabad": [
        "IDC (Islamabad Diagnostic Centre)", "Shifa International Hospital", "PIMS (Pakistan Institute of Medical Sciences)", 
        "Kulsum International Hospital", "Maroof International Hospital", "Ali Medical Centre",
        "PAF Hospital Islamabad", "Quaid-e-Azam International Hospital", "Federal Government Polyclinic Hospital"
      ],
      "Rawalpindi": [
        "IDC Rawalpindi", "Rawalpindi Institute of Cardiology (RIC)", "Holy Family Hospital", 
        "Benazir Bhutto Hospital (BBH)", "District Headquarter Hospital (DHQ)", "Hearts International Hospital", 
        "Al-Shifa Trust Eye Hospital", "Bilal Hospital", "Maryam Memorial Hospital"
      ],
      "Faisalabad": [
        "Allied Hospital", "Faisal Hospital", "DHQ Hospital Faisalabad", 
        "National Hospital Faisalabad", "Mian Muhammad Trust Hospital", "Chiniot General Hospital", "IDC Faisalabad"
      ],
      "Multan": [
        "Nishtar Hospital", "Multan Institute of Cardiology (MIC)", "Bakhtawar Amin Memorial Hospital", 
        "Mukhtar A. Sheikh Hospital", "Fatima Medical Centre", "IDC Multan"
      ],
      "Peshawar": [
        "Shaukat Khanum Peshawar", "Hayatabad Medical Complex (HMC)", "Khyber Teaching Hospital (KTH)", 
        "Lady Reading Hospital (LRH)", "Rehman Medical Institute (RMI)", "North West General Hospital", "IDC Peshawar"
      ]
    };

    const GENERAL_CLINICS = [
      "IDC (Islamabad Diagnostic Centre)", "Chughtai Medical Center", "Excel Labs / Medical Center", "Al-Khidmat Clinic"
    ];

    function updateClinicSuggestions() {
      const city = document.getElementById('patientCity').value.trim();
      const datalist = document.getElementById('clinicSuggestions');
      datalist.innerHTML = "";

      let list = PAKISTAN_CLINICS[city] || [];
      if (list.length === 0) {
        list = GENERAL_CLINICS;
      } else {
        list = [...new Set([...list, ...GENERAL_CLINICS])];
      }

      list.forEach(clinic => {
        const opt = document.createElement('option');
        opt.value = clinic;
        datalist.appendChild(opt);
      });
    }

    // Auto-detect territory rep code and URL parameters for 1-click step-up refills
    const urlParams = new URLSearchParams(window.location.search);
    const assignedRep = urlParams.get('rep') ? urlParams.get('rep').trim().toUpperCase() : 'DIRECT';
    document.getElementById('territoryRepCode').value = assignedRep;

    if (urlParams.get('name')) {
      document.getElementById('patientName').value = decodeURIComponent(urlParams.get('name'));
    }
    if (urlParams.get('mobile')) {
      document.getElementById('patientMobile').value = decodeURIComponent(urlParams.get('mobile'));
    }
    if (urlParams.get('dose')) {
      const doseVal = decodeURIComponent(urlParams.get('dose')).replace(/\s+/g, '').toLowerCase();
      const doseSelect = document.getElementById('prescribedDose');
      for (let i = 0; i < doseSelect.options.length; i++) {
        if (doseSelect.options[i].value.toLowerCase() === doseVal) {
          doseSelect.selectedIndex = i;
          break;
        }
      }
    }

    updateClinicSuggestions();

    // ============================================================
    // SEND NOTIFICATIONS FUNCTION
    // ============================================================
    async function sendOrderNotifications(order, repCode) {
      try {
        const { data: rep, error } = await client
          .from('reps')
          .select('sap_id, manager_sap_id, full_name')
          .eq('territory_code', repCode)
          .single();

        if (error) {
          console.warn('Could not find rep for notifications:', error.message);
          return;
        }

        const notificationData = {
          order_id: order.order_id || order.id,
          patient_name: order.patient_name,
          prescribed_dose: order.prescribed_dose || '5mg'
        };

        const createNotification = async (userId, userRole, title, message, type, priority, link) => {
          if (!userId) return;
          try {
            const { error: notifError } = await client
              .from('notifications')
              .insert([{
                user_id: userId,
                user_role: userRole,
                title: title,
                message: message,
                type: type || 'order',
                priority: priority || 'high',
                link: link || '/team.html',
                is_read: false,
                created_at: new Date().toISOString()
              }]);

            if (notifError) {
              console.warn('Notification insert error:', notifError);
            } else {
              console.log('✅ Notification sent to:', userId, userRole);
            }
          } catch (e) {
            console.warn('Notification error:', e);
          }
        };

        if (rep.sap_id) {
          await createNotification(
            rep.sap_id,
            'rep',
            `📦 New Order: ${notificationData.order_id}`,
            `Patient ${notificationData.patient_name} has submitted a new order for ${notificationData.prescribed_dose}`,
            'order',
            'high',
            '/team.html'
          );
        }

        if (rep.manager_sap_id) {
          await createNotification(
            rep.manager_sap_id,
            'zsm',
            `📦 New Order: ${notificationData.order_id}`,
            `Patient ${notificationData.patient_name} (${repCode}) ordered ${notificationData.prescribed_dose}`,
            'order',
            'high',
            '/admin.html'
          );
        }

        if (window.triggerPushNotification) {
          window.triggerPushNotification(
            `📦 New Order: ${order.order_id}`,
            `Patient ${order.patient_name} submitted an order for ${order.prescribed_dose || '5mg'} (Territory: ${repCode})`,
            '/',
            'order'
          );
        }

      } catch (notifyError) {
        console.warn('Notification error (non-critical):', notifyError);
      }
    }

    // ============================================================
    // SUBMIT ORDER FUNCTION - FIXED AND CLEAN
    // ============================================================
    async function submitPatientOrder(e) {
      e.preventDefault();
      
      const statusMsg = document.getElementById('submissionStatus');
      const submitBtn = document.getElementById('submitBtn');

      statusMsg.className = "text-xs text-center font-medium text-amber-500 dark:text-amber-400";
      statusMsg.innerText = "Submitting order details...";
      statusMsg.classList.remove('hidden');
      submitBtn.disabled = true;

      // Get form values
      const patient_name = document.getElementById('patientName').value.trim();
      const age = parseInt(document.getElementById('patientAge').value) || null;
      const mobile = document.getElementById('patientMobile').value.trim();
      const city = document.getElementById('patientCity').value.trim();
      const delivery_address = document.getElementById('patientAddress').value.trim();
      const doctor_name = document.getElementById('doctorName').value.trim();
      const clinic_name = document.getElementById('clinicName').value.trim();
      const indication = document.getElementById('patientIndication').value;
      const prescribed_dose = document.getElementById('prescribedDose').value;
      const device = document.getElementById('deviceType').value;
      const rep_code = document.getElementById('territoryRepCode').value.trim().toUpperCase() || 'DIRECT';

      const order_id = `TT-${Math.floor(100000 + Math.random() * 900000)}`;

      let prescription_url = null;
      const fileInput = document.getElementById('prescriptionFile');

      try {
        // Upload prescription file if selected
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${order_id}-${Date.now()}.${fileExt}`;
          
          const { error: uploadErr } = await client.storage
            .from('prescriptions')
            .upload(fileName, file);

          if (!uploadErr) {
            const { data: publicUrlData } = client.storage
              .from('prescriptions')
              .getPublicUrl(fileName);
            prescription_url = publicUrlData?.publicUrl || null;
          }
        }

        // Insert order into database
        const orderData = {
          order_id,
          patient_name,
          age,
          mobile,
          city,
          delivery_address,
          doctor_name,
          clinic_name,
          indication,
          prescribed_dose,
          device,
          rep_code,
          prescription_url,
          status: 'New Patient'
        };

        const { data: insertedOrder, error: insertErr } = await client
          .from('orders')
          .insert([orderData])
          .select()
          .single();

        if (insertErr) throw insertErr;

        console.log('✅ Order inserted:', insertedOrder);

        // Send notifications
        await sendOrderNotifications(insertedOrder || orderData, rep_code);

        // Show success
        document.getElementById('patientOrderForm').classList.add('hidden');
        document.getElementById('generatedOrderId').innerText = order_id;
        document.getElementById('successView').classList.remove('hidden');

      } catch (err) {
        console.error('❌ Order submission error:', err);
        statusMsg.className = "text-xs text-center font-medium text-rose-500";
        statusMsg.innerText = "Failed to submit order: " + err.message;
        submitBtn.disabled = false;
      }
    }

    function resetForAnotherOrder() {
      document.getElementById('patientOrderForm').reset();
      document.getElementById('territoryRepCode').value = assignedRep;
      document.getElementById('submissionStatus').classList.add('hidden');
      document.getElementById('submitBtn').disabled = false;

      document.getElementById('successView').classList.add('hidden');
      document.getElementById('patientOrderForm').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeCurrentWindow() {
      window.close();
      setTimeout(() => {
        document.body.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 font-sans text-center transition-colors duration-200">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl max-w-sm w-full space-y-3 shadow-xl">
              <div class="text-3xl text-emerald-600 dark:text-emerald-400">✓</div>
              <h3 class="text-base font-bold text-slate-900 dark:text-white">Order Submitted Successfully</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">You may now safely close this browser tab.</p>
            </div>
          </div>
        `;
      }, 300);
    }

    updateClinicSuggestions();
    checkGlobalBroadcast('patient');
  </script>
</body>
</html>
