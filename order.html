<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — Patient Prescription Order</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 min-h-screen font-sans text-slate-100 p-4 md:p-8 flex items-center justify-center">

  <div class="max-w-2xl w-full bg-slate-900/80 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl backdrop-blur-xl space-y-6">
    
    <!-- Top Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
      <a href="/" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition-all flex items-center gap-1.5">
        <span>🏠</span> Home
      </a>
      <span class="text-[11px] font-bold text-teal-400 bg-teal-500/10 px-3 py-1 rounded-full border border-teal-500/20">
        Patient Support Care
      </span>
    </div>

    <!-- Title Header -->
    <div class="text-center space-y-1.5">
      <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">
        TirzaTrim <span class="text-teal-400">Patient Support</span>
      </h1>
      <p class="text-xs text-slate-400 max-w-md mx-auto">
        Submit your details and prescription below to start your order.
      </p>
    </div>

    <!-- ORDER FORM -->
    <form id="patientOrderForm" onsubmit="submitPatientOrder(event)" class="space-y-6">
      
      <!-- 1. PERSONAL DETAILS -->
      <div class="space-y-3">
        <div class="text-xs font-bold uppercase tracking-wider text-teal-400 flex items-center gap-1.5">
          <span>👤</span> 1. PERSONAL DETAILS
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2">
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Full Name *</label>
            <input type="text" id="patientName" required placeholder="Full Name" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-teal-500 placeholder-slate-600 transition-all">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Age *</label>
            <input type="number" id="patientAge" required placeholder="e.g. 35" min="1" max="120" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-teal-500 placeholder-slate-600 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1">Mobile Number (WhatsApp) *</label>
          <input type="tel" id="patientMobile" required placeholder="03XXXXXXXXX" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white font-mono outline-none focus:border-teal-500 placeholder-slate-600 transition-all">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">City / Area *</label>
            <input type="text" id="patientCity" required placeholder="City / Area" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-teal-500 placeholder-slate-600 transition-all">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Delivery Address *</label>
            <input type="text" id="patientAddress" required placeholder="Delivery Address" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-teal-500 placeholder-slate-600 transition-all">
          </div>
        </div>
      </div>

      <!-- 2. TREATMENT DETAILS -->
      <div class="space-y-3 pt-2">
        <div class="text-xs font-bold uppercase tracking-wider text-teal-400 flex items-center gap-1.5">
          <span>🩺</span> 2. TREATMENT DETAILS
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1">Doctor Name / Clinic *</label>
          <input type="text" id="doctorName" required placeholder="Dr. XYZ" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-teal-500 placeholder-slate-600 transition-all">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1">Indication *</label>
          <select id="patientIndication" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-medium text-white outline-none focus:border-teal-500 transition-all">
            <option value="Weight Management">Weight Management</option>
            <option value="Type 2 Diabetes">Type 2 Diabetes</option>
            <option value="Cardio-Metabolic Care">Cardio-Metabolic Care</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Prescribed Dose *</label>
            <select id="prescribedDose" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white outline-none focus:border-teal-500 transition-all">
              <option value="2.5mg">TirzaTrim 2.5mg</option>
              <option value="5mg" selected>TirzaTrim 5mg</option>
              <option value="7.5mg">TirzaTrim 7.5mg</option>
              <option value="10mg">TirzaTrim 10mg</option>
              <option value="12.5mg">TirzaTrim 12.5mg</option>
              <option value="15mg">TirzaTrim 15mg</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Device Type *</label>
            <select id="deviceType" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-white outline-none focus:border-teal-500 transition-all">
              <option value="5mg Multi-Dose Pen">5mg Multi-Dose Pen</option>
              <option value="10mg Multi-Dose Pen">10mg Multi-Dose Pen</option>
              <option value="15mg Multi-Dose Pen">15mg Multi-Dose Pen</option>
            </select>
          </div>
        </div>

        <!-- Hidden Territory Code captured from URL (?rep=QL2.1) -->
        <input type="hidden" id="territoryRepCode" value="">

        <!-- Prescription Upload -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1">Upload Prescription Photo (Optional)</label>
          <input type="file" id="prescriptionFile" accept="image/*,.pdf" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-teal-400 hover:file:bg-slate-700 cursor-pointer transition-all">
        </div>
      </div>

      <!-- Submit Button & Status Message -->
      <div class="pt-2 space-y-3">
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 text-white text-xs md:text-sm font-bold rounded-2xl shadow-lg shadow-teal-600/20 transition-all flex items-center justify-center gap-2">
          <span>🚀</span>
          <span>Submit Order</span>
        </button>
        <p id="submissionStatus" class="text-xs text-center font-medium hidden"></p>
      </div>

    </form>

    <!-- Success Confirmation -->
    <div id="successView" class="text-center space-y-4 py-8 hidden">
      <div class="w-16 h-16 rounded-3xl bg-emerald-500/10 border border-emerald-500/20 text-3xl flex items-center justify-center mx-auto text-emerald-400">
        ✓
      </div>
      <div class="space-y-1">
        <h2 class="text-xl font-black text-white">Order Received!</h2>
        <p class="text-xs text-slate-400 max-w-sm mx-auto">
          Your order ID is <strong id="generatedOrderId" class="text-teal-400 font-mono">TT-XXXXX</strong>. Our patient support team will contact you on WhatsApp shortly.
        </p>
      </div>
      <div class="pt-2">
        <a href="/" class="inline-block px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl transition-all">
          Return to Home
        </a>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Capture territory rep code from URL parameter (?rep=QL2.1)
    const urlParams = new URLSearchParams(window.location.search);
    const assignedRep = urlParams.get('rep') ? urlParams.get('rep').trim().toUpperCase() : 'DIRECT';
    document.getElementById('territoryRepCode').value = assignedRep;

    async function submitPatientOrder(e) {
      e.preventDefault();
      const statusMsg = document.getElementById('submissionStatus');
      const submitBtn = document.getElementById('submitBtn');

      statusMsg.className = "text-xs text-center font-medium text-amber-400";
      statusMsg.innerText = "Submitting order details...";
      statusMsg.classList.remove('hidden');
      submitBtn.disabled = true;

      const patient_name = document.getElementById('patientName').value.trim();
      const age = parseInt(document.getElementById('patientAge').value) || null;
      const mobile = document.getElementById('patientMobile').value.trim();
      const city = document.getElementById('patientCity').value.trim();
      const delivery_address = document.getElementById('patientAddress').value.trim();
      const doctor_name = document.getElementById('doctorName').value.trim();
      const indication = document.getElementById('patientIndication').value;
      const prescribed_dose = document.getElementById('prescribedDose').value;
      const device = document.getElementById('deviceType').value;
      const rep_code = document.getElementById('territoryRepCode').value || 'DIRECT';

      const order_id = `TT-${Math.floor(100000 + Math.random() * 900000)}`;

      let prescription_url = null;
      const fileInput = document.getElementById('prescriptionFile');

      try {
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${order_id}-${Date.now()}.${fileExt}`;
          
          const { data: uploadData, error: uploadErr } = await client.storage
            .from('prescriptions')
            .upload(fileName, file);

          if (!uploadErr && uploadData) {
            const { data: publicUrlData } = client.storage
              .from('prescriptions')
              .getPublicUrl(fileName);
            prescription_url = publicUrlData?.publicUrl || null;
          }
        }

        const { error: insertErr } = await client
          .from('orders')
          .insert([{
            order_id,
            patient_name,
            age,
            mobile,
            city,
            delivery_address,
            doctor_name,
            indication,
            prescribed_dose,
            device,
            rep_code,
            prescription_url,
            status: 'New Patient'
          }]);

        if (insertErr) throw insertErr;

        document.getElementById('patientOrderForm').classList.add('hidden');
        document.getElementById('generatedOrderId').innerText = order_id;
        document.getElementById('successView').classList.remove('hidden');

      } catch (err) {
        statusMsg.className = "text-xs text-center font-medium text-rose-500";
        statusMsg.innerText = "Failed to submit order: " + err.message;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
