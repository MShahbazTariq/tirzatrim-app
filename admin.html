<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim Team Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">TirzaTrim Team Dashboard</h1>
        <p class="text-xs text-slate-500">Manage patient orders, prescriptions, and updates.</p>
      </div>
      <button onclick="fetchOrders()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg">
        Refresh Orders
      </button>
    </div>

    <!-- Orders Table -->
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-xs text-slate-400 uppercase tracking-wider border-b">
            <tr>
              <th class="p-4">Order ID / Date</th>
              <th class="p-4">Patient Info</th>
              <th class="p-4">Doctor & Dose</th>
              <th class="p-4">Prescription</th>
              <th class="p-4">Status</th>
              <th class="p-4">Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y">
            <tr>
              <td colspan="6" class="p-6 text-center text-slate-400">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statuses = [
      'New Patient', 'Prescription Received', 'Prescription Verified',
      'Order Processing', 'Dispatched', 'Delivered', 'Patient Confirmed',
      'Usage Guidance Completed', 'Feedback Submitted', 'Completed'
    ];

    async function fetchOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">Loading orders...</td></tr>';

      const { data: orders, error } = await client
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-rose-500">Error: ${error.message}</td></tr>`;
        return;
      }

      if (!orders || orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400">No orders found.</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(order => `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="p-4">
            <span class="font-mono font-bold text-slate-800 block">${order.order_id || 'N/A'}</span>
            <span class="text-xs text-slate-400">${new Date(order.created_at).toLocaleDateString()}</span>
          </td>
          <td class="p-4">
            <div class="font-semibold text-slate-800">${order.patient_name}</div>
            <div class="text-xs text-slate-500">${order.mobile}</div>
            <div class="text-xs text-slate-400">${order.city}</div>
          </td>
          <td class="p-4">
            <div class="text-xs font-semibold text-slate-700">${order.indication}</div>
            <div class="text-xs text-emerald-600 font-bold">${order.prescribed_dose}</div>
          </td>
          <td class="p-4">
            ${order.prescription_url 
              ? `<a href="${order.prescription_url}" target="_blank" class="text-xs text-blue-600 underline hover:text-blue-800">View File</a>` 
              : '<span class="text-xs text-slate-400">None</span>'}
          </td>
          <td class="p-4">
            <select onchange="updateStatus('${order.id}', this.value)" class="text-xs font-medium border rounded-md p-1.5 bg-slate-50 text-slate-700">
              ${statuses.map(s => `<option value="${s}" ${order.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
          <td class="p-4">
            <button onclick="sendWhatsApp('${order.mobile}', '${order.patient_name}', '${order.order_id}', '${order.status}')" class="px-3 py-1.5 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 text-xs font-semibold rounded-md">
              WhatsApp
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(orderId, newStatus) {
      await client.from('orders').update({ status: newStatus }).eq('id', orderId);
      fetchOrders();
    }

    function sendWhatsApp(mobile, name, orderId, status) {
      const msg = `Hello ${name}, update regarding your TirzaTrim order (${orderId}): Current status is now "${status}".`;
      window.open(`https://wa.me/${mobile}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    fetchOrders();
  </script>
</body>
</html>
