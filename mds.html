<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TirzaTrim — MDS Express Fulfillment Hub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/theme.js"></script>
  <script src="/broadcast.js"></script>
  <script src="/notification.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans text-slate-900 dark:text-slate-100 p-4 md:p-8 transition-colors duration-200">

  <!-- AUTH / PASSWORD PROTECTION SCREEN -->
  <div id="authScreen" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6 text-center">
      <div class="w-12 h-12 rounded-2xl bg-teal-500/10 border border-teal-500/20 text-2xl flex items-center justify-center mx-auto text-teal-600">
        ⚡
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-900 dark:text-white">MDS Express Portal</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" id="authSubtitle">Enter password to unlock same-day urgent queue</p>
      </div>

      <form id="authForm" onsubmit="handlePortalAuth(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-[11px] font-semibold text-slate-500 mb-1" id="passLabel">Password (Default: admin123)</label>
          <input type="password" id="authPassword" placeholder="Enter password" required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-teal-500">
        </div>
        <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-teal-600/20 transition-all">
          Unlock MDS Hub
        </button>
      </form>
      <p id="authErrorMsg" class="text-xs text-rose-500 font-medium hidden"></p>
    </div>
  </div>

  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl backdrop-blur-xl shadow-sm">
      <div>
        <div class="flex items-center gap-2">
          <a href="/" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-800 dark:text-slate-300 text-xs font-bold mr-1">🏠 Home</a>
          <h1 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white tracking-tight">MDS Express <span class="text-teal-600 dark:text-teal-400">Partner Hub</span></h1>
          <span class="px-2.5 py-0.5 bg-teal-500/10 text-teal-600 text-xs font-bold rounded-full">Same-Day Urgent</span>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Showing all orders routed specifically to local MDS city partners</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="handleLogout()" class="px-3.5 py-2 rounded-xl bg-rose-500/10 text-rose-600 border border-rose-500/20 text-xs font-bold">🚪 Lock Portal</button>
        <button onclick="window.fetchMdsOrders()" class="px-4 py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-300 text-xs font-bold rounded-xl">🔄 Refresh</button>
      </div>
    </div>

    <!-- ORDERS LIST CONTAINER -->
    <div class="space-y-3">
      <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
        <span>⚡</span> MDS Partner Routed Orders (<span id="filteredCount">0</span>)
      </h3>
      <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full py-12 text-center text-slate-400 text-xs">Loading MDS queue...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://yygmkqzbbnpyikvlqibw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wN0uOuHt57_4A5Ufs2vo8g_8ImKIuKJ";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allOrders = [];
    let isFirstLoginSetup = false;

    async function handlePortalAuth(e) {
      e.preventDefault();
      const err = document.getElementById('authErrorMsg');
      err.classList.add('hidden');
      const pass = document.getElementById('authPassword').value.trim();

      try {
        let { data, error } = await client.from('portal_auth').select('*').eq('portal_key', 'mds_hub').single();
        
        if (!data) {
          await client.from('portal_auth').insert([{ portal_key: 'mds_hub', password: 'admin123', is_default: true }]);
          data = { password: 'admin123', is_default: true };
        }

        if (isFirstLoginSetup) {
          await client.from('portal_auth').update({ password: pass, is_default: false }).eq('portal_key', 'mds_hub');
          alert("✅ New secure password saved successfully!");
          sessionStorage.setItem('mds_authenticated', 'true');
          unlockPortal();
          return;
        }

        if (pass === data.password) {
          if (data.is_default) {
            isFirstLoginSetup = true;
            document.getElementById('authSubtitle').innerText = "Security Notice: Please set a new secure password for this portal.";
            document.getElementById('passLabel').innerText = "Set New Secure Password";
            document.getElementById('authPassword').value = '';
            document.getElementById('authSubmitBtn').innerText = "Save & Unlock Portal";
            return;
          }
          sessionStorage.setItem('mds_authenticated', 'true');
          unlockPortal();
        } else {
          throw new Error("Invalid password. (Default is admin123)");
        }
      } catch (ex) {
        err.innerText = ex.message;
        err.classList.remove('hidden');
      }
    }

    function unlockPortal() {
      document.getElementById('authScreen').classList.add('hidden');
      window.fetchMdsOrders();
    }

    function handleLogout() {
      sessionStorage.removeItem('mds_authenticated');
      location.reload();
    }

    window.fetchMdsOrders = async function() {
      const { data, error } = await client
        .from('orders')
        .select('*')
        .eq('fulfillment_channel', 'MDS')
        .order('created_at', { ascending: false });

      if (error) return;
      allOrders = data || [];
      renderOrders();
    };

    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      document.getElementById('filteredCount').innerText = allOrders.length;

      if (allOrders.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-xs">No orders currently routed to MDS Express.</div>';
        return;
      }

      grid.innerHTML = allOrders.map(order => {
        const isDelivered = ['Delivered', 'Patient Confirmed', 'Completed'].includes(order.status);
        const isDispatched = order.status === 'Dispatched';

        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-4 shadow-sm">
            <div class="flex items-start justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
              <div>
                <span class="font-mono font-bold text-slate-900 dark:text-white text-xs">${order.order_id}</span>
                <div class="text-[11px] text-teal-600 font-bold mt-0.5">Partner: ${order.mds_provider || 'Express'}</div>
              </div>
              <span class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-teal-500/10 text-teal-600 border border-teal-500/20">${order.status}</span>
            </div>
            <div class="space-y-1 text-xs">
              <div class="font-bold text-sm text-slate-900 dark:text-white">👤 ${order.patient_name}</div>
              <div class="text-slate-400 font-mono">${order.mobile}</div>
              <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-950 text-slate-700 dark:text-slate-300">📍 <strong>${order.city}:</strong> ${order.delivery_address || 'No address'}</div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
              <button onclick="updateStatus('${order.id}', 'Dispatched')" class="py-2 bg-amber-500/10 text-amber-600 font-bold rounded-xl text-xs">🚚 Out for Delivery</button>
              <button onclick="updateStatus('${order.id}', 'Delivered')" class="py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs">✅ Delivered</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, status) {
      await client.from('orders').update({ status }).eq('id', id);
      window.fetchMdsOrders();
    }

    if (sessionStorage.getItem('mds_authenticated') === 'true') {
      unlockPortal();
    }
  </script>
</body>
</html>
